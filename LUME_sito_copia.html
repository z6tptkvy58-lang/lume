  $$(".lang-sel").forEach(s => { s.value = lang; });
  $("#quote").innerHTML = esc(t("man.q1")) + " <em>" + esc(t("man.q2")) + "</em>";
  $("#heroPrice").textContent = t("hero.price", { p: money(PRICE.inox) });
  $$(".ptag").forEach(el => { $("span", el).textContent = t("part." + el.dataset.part); });
  renderCfg(false);
  renderSpecs(currentTab, false);
  renderFaq();
  renderDrawer();
  renderPhoneState();
  $("#wlMsg").textContent = wlState ? t(wlState) : "";
  if (studioLightLabel) studioLightLabel.textContent = t(LUME.studio.light ? "viewer.off" : "viewer.on");
}
$$(".lang-sel").forEach(s => s.addEventListener("change", () => {
  lang = s.value; store.set("lume.lang", lang); applyI18n(); LUME.emit("lang", lang);
}));

/* =========================================================
   STORY: chiavi di animazione legate allo scroll
   p, theta, phi, raggio, targetY, esploso, luce, spostamento laterale
   ========================================================= */
const KEYS = [
  [0.00, 0.50, 0.08, 1200, 112, 0, 1.00, 0],
  [0.07, 0.62, 0.10, 1230, 116, 0, 1.00, 0],
  [0.22, 1.30, 0.24, 1320, 255, 1, 0.50, 1],
  [0.38, 1.90, 0.20, 1260, 255, 1, 0.50, 1],
  [0.44, 2.40, 0.55,  740, 420, 1, 0.95, 1],
  [0.51, 2.70, 0.48,  720, 420, 1, 0.95, 1],
  [0.56, 6.33, 0.04,  640, 172, 0, 1.00, 1],
  [0.63, 6.42, 0.05,  610, 172, 0, 1.00, 1],
  [0.68, 7.05, 0.12,  560,  70, 0, 0.55, 1],
  [0.75, 7.35, 0.16,  540,  60, 0, 0.55, 1],
  [0.80, 7.90,-0.55,  960,  90, 1, 0.40, 1],
  [0.87, 8.30,-0.60,  960,  90, 1, 0.40, 1],
  [0.94, 6.83, 0.12,  980, 228, 0, 1.00, 0],
  [1.00, 6.95, 0.12,  980, 228, 0, 1.00, 0],
];
const CH = [ [.22,.40], [.42,.52], [.545,.64], [.665,.755], [.785,.875] ];
const CH_CENTER = [.31, .47, .595, .71, .83];
function sampleKeys(p){
  let i = 0;
  while (i < KEYS.length-2 && p > KEYS[i+1][0]) i++;
  const a = KEYS[i], b = KEYS[i+1];
  const u = smooth(clamp((p - a[0]) / (b[0] - a[0])));
  const v = k => lerp(a[k], b[k], u);
  return { th:v(1), ph:v(2), r:v(3), ty:v(4), e:v(5), L:v(6), sx:v(7) };
}
const band = (p, a, b, f=.03) => Math.min(smooth(clamp((p-a)/f)), smooth(clamp((b-p)/f)));
function ignite(s){
  if (s < .35) return 0;
  if (s < .42) return .85;
  if (s < .50) return .12;
  if (s < .62) return 1;
  if (s < .68) return .3;
  if (s < 1.7) return .55 + .45*smooth((s-.68)/1.02);
  return 1;
}

const story = $("#design"), stage = $("#stage");
const heroUi = $("#heroUi"), heroTitle = $("#heroTitle"), outro = $("#outro"), rail = $("#rail");
const chapters = $$(".chapter");
CH_CENTER.forEach((c, i) => {
  const b = document.createElement("button");
  b.setAttribute("aria-label", String(i+1));
  b.addEventListener("click", () => {
    const top = story.offsetTop + c * (story.offsetHeight - innerHeight);
    scrollTo({ top, behavior:"smooth" });
  });
  rail.appendChild(b);
});
const railDots = $$("button", rail);

const PARTS = ["base","shellL","shellR","bulb","socket","cable","plate","screws","feet"];
const tagsBox = $("#tags");
PARTS.forEach(id => {
  const el = document.createElement("div");
  el.className = "ptag"; el.dataset.part = id;
  el.innerHTML = "<i></i><span></span>";
  tagsBox.appendChild(el);
});

stage.addEventListener("pointermove", e => {
  const r = stage.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  stage.style.setProperty("--mx", (x*100).toFixed(1) + "%");
  stage.style.setProperty("--my", (y*100).toFixed(1) + "%");
  LUME.pointer.x = x*2 - 1; LUME.pointer.y = y*2 - 1;
});

let pS = 0, t0 = performance.now();
function storyFrame(dt, now){
  const r = story.getBoundingClientRect();
  const total = Math.max(1, r.height - innerHeight);
  const pT = clamp(-r.top / total);
  pS += (pT - pS) * (1 - Math.exp(-dt * 7));
  if (Math.abs(pT - pS) < 1e-4) pS = pT;
  const visible = r.bottom > 0 && r.top < innerHeight;
  const k = sampleKeys(pS);
  const ign = ignite((now - t0) / 1000);
  const hero = 1 - smooth(clamp((pS - .02) / .07));
  const w = CH.map(([a,b]) => band(pS, a, b));
  const wAll = band(pS, .20, .40, .035);
  const st = LUME.story;
  Object.assign(st, k, { p:pS, visible, L:k.L*ign, ign, hero, w });
  st.hl = { shellL:w[1], shellR:w[1], base:w[3], plate:w[4], screws:w[4], feet:w[4], cable:w[4] };
  st.tagVis = {};
  PARTS.forEach(id => { st.tagVis[id] = Math.max(wAll, st.hl[id] || 0, id === "bulb" ? w[1] : 0); });

  if (!visible) return;
  document.documentElement.style.setProperty("--g", (ign * lerp(.35, 1, k.L)).toFixed(3));
  stage.style.setProperty("--bl", st.L.toFixed(3));
  heroUi.style.opacity = hero.toFixed(3);
  heroUi.style.transform = `translateY(${(-(1-hero)*30).toFixed(1)}px)`;
  heroUi.style.visibility = hero < .01 ? "hidden" : "visible";
  heroTitle.style.opacity = hero.toFixed(3);
  const m = isMobile();
  chapters.forEach((c, i) => {
    const v = w[i];
    c.style.opacity = v.toFixed(3);
    c.style.transform = m ? `translateY(${((1-v)*18).toFixed(1)}px)` : `translateY(calc(-50% + ${((1-v)*18).toFixed(1)}px))`;
    c.style.visibility = v < .01 ? "hidden" : "visible";
  });
  const o = band(pS, .925, 1.2);
  outro.style.opacity = o.toFixed(3);
  outro.style.transform = `translateY(${((1-o)*20).toFixed(1)}px)`;
  rail.style.opacity = (pS > .2 && pS < .9) ? "1" : "0";
  railDots.forEach((d, i) => d.classList.toggle("on", w[i] > .5));

  if (document.body.classList.contains("no-3d")){
    lightSVG(storySVG, st.L, k.e);
    explodeSVG(storySVG, k.e);
  }
}

/* =========================================================
   CONFIGURATORE
   ========================================================= */
const swBox = $("#swatches");
COLORS.forEach(c => {
  const b = document.createElement("button");
  b.className = "swc"; b.dataset.color = c.id; b.setAttribute("role", "radio");
  b.innerHTML = `<i style="background:${c.hex}"></i>`;
  swBox.appendChild(b);
});
let shownPrice = unitPrice(cfg), priceAnim = null;
function animatePrice(to, anim=true){
  const el = $("#sumPrice");
  if (!anim){ shownPrice = to; el.textContent = money(to); return; }
  const from = shownPrice, t1 = performance.now(), D = 650;
  cancelAnimationFrame(priceAnim);
  const step = now => {
    const u = clamp((now - t1) / D), e = 1 - Math.pow(1-u, 3);
    shownPrice = Math.round(lerp(from, to, e));
    el.textContent = money(shownPrice);
    if (u < 1) priceAnim = requestAnimationFrame(step);
  };
  priceAnim = requestAnimationFrame(step);
}
function renderCfg(anim=true){
  $$(".opt").forEach(o => { const on = o.dataset.finish === cfg.finish; o.classList.toggle("on", on); o.setAttribute("aria-checked", on); });
  $("#paintGroup").classList.toggle("shut", cfg.finish !== "paint");
  const seg = $("#surfaceSeg");
  seg.classList.toggle("right", cfg.surface === "gloss");
  $$("button", seg).forEach(b => b.classList.toggle("on", b.dataset.surface === cfg.surface));
  $$(".swc", swBox).forEach(b => {
    const on = b.dataset.color === cfg.color;
    b.classList.toggle("on", on); b.setAttribute("aria-checked", on);
    b.classList.toggle("gloss", cfg.surface === "gloss");
    b.setAttribute("aria-label", t("col." + b.dataset.color));
    b.title = t("col." + b.dataset.color);
  });
  $("#colorName").textContent = t("col." + cfg.color);
  $$("[data-extra]").forEach(r => r.setAttribute("aria-checked", !!cfg[r.dataset.extra]));
  $$("[data-price]").forEach(el => {
    const k = el.dataset.price;
    el.textContent = k === "paintFrom" ? t("cfg.from", { p:money(PRICE.matte) })
      : (k === "bulb" || k === "connect") ? "+ " + money(PRICE[k]) : money(PRICE[k]);
  });
  $("#sumDesc").textContent = describe(cfg);
  animatePrice(unitPrice(cfg), anim);
  const badge = $("#vBadge");
  $("i", badge).style.background = cfg.finish === "inox" ? "linear-gradient(115deg,#8e9094,#eceef0 40%,#a9abae 70%,#f4f5f6)" : colorHex(cfg.color);
  $("span", badge).textContent = finishLabel(cfg);

const HS = $$(".hs", viewer);
const HS_FB = { 1:[100,58], 2:[100,200], 3:[166,320], 4:[100,340] }; // coordinate nel disegno 200×345
function placeFallbackHS(){
  if (!document.body.classList.contains("no-3d")) return;
  const H = viewer.clientHeight * .8, W = H * 200/345;
  const ox = (viewer.clientWidth - W)/2, oy = viewer.clientHeight * .1;
  HS.forEach(h => { const [x,y] = HS_FB[h.dataset.hs]; h.style.left = (ox + x/200*W) + "px"; h.style.top = (oy + y/345*H) + "px"; });
}
const pop = $("#pop");
let popFor = null;
function closePop(){ pop.classList.remove("on"); HS.forEach(h => h.classList.remove("open")); popFor = null; }
function openPop(h){
  const id = h.dataset.hs;
  $("#popN").textContent = "0" + id;
  $("#popT").textContent = t("hs" + id + ".t");
  $("#popB").textContent = t("hs" + id + ".b");
  HS.forEach(x => x.classList.toggle("open", x === h));
  popFor = h; positionPop(); pop.classList.add("on");
}
function positionPop(){
  if (!popFor) return;
  const x = parseFloat(popFor.style.left) || 0, y = parseFloat(popFor.style.top) || 0;
  const W = viewer.clientWidth, Hh = viewer.clientHeight, pw = Math.min(260, W - 32), ph = pop.offsetHeight || 140;
  pop.style.width = pw + "px";
  let left = x > W/2 ? x - 26 - pw : x + 26;
  let top = y - 24;
  left = clamp(left, 16, W - pw - 16); top = clamp(top, 16, Hh - ph - 70);
  pop.style.left = left + "px"; pop.style.top = top + "px";
  if (popFor.classList.contains("hide")) closePop();
}
HS.forEach(h => h.addEventListener("click", e => { e.stopPropagation(); popFor === h ? closePop() : openPop(h); }));
viewer.addEventListener("click", e => { if (!e.target.closest(".pop,.hs,.v-tools")) closePop(); });

const feats = $("#feats"), featLis = $$("li", feats), screens = $("#screens"), pdots = $$("#pdots button");
let appI = 0;
function setApp(i){

const holdAuto = ms => { feats.classList.add("paused"); clearTimeout(holdT); holdT = setTimeout(() => { if (appVisible) feats.classList.remove("paused"); }, ms); };
phone.addEventListener("pointerenter", e => { if (e.pointerType === "mouse"){ feats.classList.add("paused"); clearTimeout(holdT); } });

const scrLight = $("#scrLight"), track = $("#track");
const ph = { lv:.72, on:true, checked:false };
function renderPhoneState(){
  scrLight.style.setProperty("--lv", ph.on ? ph.lv : 0);

const drawer = $("#drawer"), scrim = $("#scrim"), drBody = $("#drBody"), drFoot = $("#drFoot");
const COUNTRIES = ["IT","DE","FR","ES","AT","CH","BE","NL","PT","IE","LU"];
const DEF_C = { it:"IT", en:"IE", de:"DE", fr:"FR", es:"ES", ja:"IT", zh:"IT" };
const co = { step:1, form:{ name:"", email:"", address:"", zip:"", city:"", country:"" }, pay:"card", order:null };
const ICON = {
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>',
  ret:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M4 9h11a5 5 0 0 1 0 10H9"/><path d="M8 5 4 9l4 4"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="m3 7 9-4 9 4v10l-9 4-9-4V7Z"/><path d="m3 7 9 4 9-4M12 11v10"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
};
const countryName = code => { try { return new Intl.DisplayNames([LOC[lang]], { type:"region" }).of(code); } catch(e){ return code; } };
const cartTotal = () => cart.reduce((s,i) => s + unitPrice(i.cfg) * i.qty, 0);

function openDrawer(){
  if (co.step === 4){ co.step = 1; co.order = null; }
  $("#toast").classList.remove("on");
  renderDrawer();
  drawer.classList.add("on"); scrim.classList.add("on");

}

}

addEventListener("keydown", e => { if (e.key === "Escape"){ if (drawer.classList.contains("on")) closeDrawer(); else closePop(); } });

function itemHTML(it, i, editable=true){
  return `<div class="item" data-i="${i}">
    <div class="th" data-th="${i}"></div>
    <div><h4>LUME</h4><p>${esc(finishLabel(it.cfg))}</p>${extrasLabel(it.cfg) ? `<p>+ ${esc(extrasLabel(it.cfg))}</p>` : ""}
      ${editable ? `<button class="rm" data-rm="${i}">${esc(t("co.remove"))}</button>` : `<p>× ${it.qty}</p>`}</div>
    <div class="r"><strong>${money(unitPrice(it.cfg) * it.qty)}</strong>
      ${editable ? `<div class="qty"><button data-q="-1" data-i="${i}" aria-label="−">−</button><span>${it.qty}</span><button data-q="1" data-i="${i}" aria-label="+">+</button></div>` : ""}</div>
  </div>`;

function fillThumbs(items){
  $$("[data-th]", drBody).forEach(el => {
    el.innerHTML = lampSVG();
    const s = $("svg", el); s.style.height = "84px";
    paintSVG(s, items[+el.dataset.th].cfg);
  });
}
function field(id, label, half, type="text", ac=""){
  const v = co.form[id] || "";
  return `<div class="fld${half ? " half" : ""}" data-f="${id}"><label for="f_${id}">${esc(label)}</label>
    <input id="f_${id}" name="${id}" type="${type}" value="${esc(v)}" ${ac ? `autocomplete="${ac}"` : ""}><span class="err"></span></div>`;
}
function renderDrawer(){
  const stepper = $("#stepper");
  const empty = cart.length === 0 && co.step !== 4;
  stepper.classList.toggle("hide", empty || co.step === 4);
  $$("div", stepper).forEach((d, i) => d.classList.toggle("on", i < co.step));
  const tot = money(cartTotal());
  let body = "", foot = "";

  if (co.step === 4 && co.order){
    body = `<div class="done dr-view">
      <div class="ok"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
      <h3>${esc(t("co.thanks", { n: co.order.first }))}</h3>
      <p>${esc(t("co.done", { id: co.order.id }))}</p>
      <ol class="tl"><li><b>1</b>${esc(t("co.n1"))}</li><li><b>2</b>${esc(t("co.n2"))}</li><li><b>3</b>${esc(t("co.n3"))}</li></ol>
      <p class="demo-l">${esc(t("demo"))}</p></div>`;
    foot = `<div class="acts"><button class="btn btn-primary" data-co="keep">${esc(t("co.keep"))}</button></div>`;
  } else if (empty){
    body = `<div class="empty dr-view"><p>${esc(t("co.empty"))}</p><button class="btn btn-primary" data-co="config">${esc(t("co.empty.cta"))}</button></div>`;
    foot = "";
  } else if (co.step === 1){
    body = `<div class="dr-view">${cart.map((it,i) => itemHTML(it,i)).join("")}
      <div class="reassure"><div>${ICON.shield}${esc(t("trust.warranty"))}</div><div>${ICON.ret}${esc(t("trust.returns"))}</div><div>${ICON.box}${esc(t("trust.pack"))}</div></div></div>`;
    foot = `<div class="ln"><span>${esc(t("co.subtotal"))}</span><span>${tot}</span></div>
      <div class="ln"><span>${esc(t("co.shipping"))}</span><span>${esc(t("co.free"))}</span></div>
      <div class="ln tot"><span>${esc(t("cfg.total"))}</span><span>${tot}</span></div>
      <div class="acts"><button class="btn btn-primary" data-co="next">${esc(t("co.next"))}</button></div>`;
  } else if (co.step === 2){
    if (!co.form.country) co.form.country = DEF_C[lang];
    const opts = COUNTRIES.map(c => `<option value="${c}"${c === co.form.country ? " selected" : ""}>${esc(countryName(c))}</option>`).join("");
    body = `<form class="form dr-view" id="shipForm" novalidate>
      ${field("name", t("co.name"), false, "text", "name")}
      ${field("email", t("co.email"), false, "email", "email")}
      ${field("address", t("co.address"), false, "text", "street-address")}
      ${field("zip", t("co.zip"), true, "text", "postal-code")}
      ${field("city", t("co.city"), true, "text", "address-level2")}
      <div class="fld" data-f="country"><label for="f_country">${esc(t("co.country"))}</label><select id="f_country" name="country">${opts}</select></div>
    </form>`;
    foot = `<div class="ln tot"><span>${esc(t("cfg.total"))}</span><span>${tot}</span></div>
      <div class="acts"><button class="btn btn-ghost" data-co="back">${esc(t("co.back"))}</button><button class="btn btn-primary" data-co="next">${esc(t("co.next"))}</button></div>`;
  } else if (co.step === 3){
    const f = co.form;
    body = `<div class="dr-view">
      <div class="box"><div class="hd"><span>${esc(t("co.order"))}</span><button data-co="goto1">${esc(t("co.edit"))}</button></div>
        ${cart.map(it => `${it.qty} × LUME — ${esc(describe(it.cfg))}`).join("<br>")}</div>
      <div class="box"><div class="hd"><span>${esc(t("co.shipto"))}</span><button data-co="goto2">${esc(t("co.edit"))}</button></div>
        ${esc(f.name)}<br>${esc(f.address)}<br>${esc(f.zip)} ${esc(f.city)}, ${esc(countryName(f.country))}<br>${esc(f.email)}</div>
      <p style="font-size:13px;font-weight:600;margin:22px 0 4px">${esc(t("co.pay"))}</p>
      <div class="pays">${["card","paypal","bank"].map(m => `<button class="pay${co.pay === m ? " on" : ""}" data-pay="${m}"><i></i>${esc(t("co."+m))}</button>`).join("")}</div>
      <div class="paynote">${ICON.lock.replace('<svg', '<svg style="width:18px;height:18px;flex:none;stroke:#3a3733"')}<span>${esc(t("co.paynote"))}</span></div>
      <p class="demo-l">${esc(t("demo"))}</p></div>`;
    foot = `<div class="ln tot"><span>${esc(t("cfg.total"))}</span><span>${tot}</span></div>
      <div class="acts"><button class="btn btn-ghost" data-co="back">${esc(t("co.back"))}</button><button class="btn btn-primary" data-co="confirm">${esc(t("co.confirm"))}</button></div>`;
  }
  drBody.innerHTML = body; drFoot.innerHTML = foot;
  drFoot.style.display = foot ? "" : "none";
  if (co.step === 1) fillThumbs(cart);
  const sf = $("#shipForm");
  if (sf){
    sf.addEventListener("input", e => { co.form[e.target.name] = e.target.value; e.target.closest(".fld").classList.remove("bad"); });
    sf.addEventListener("change", e => { co.form[e.target.name] = e.target.value; });
    sf.addEventListener("submit", e => { e.preventDefault(); next(); });
  }
}
function validShip(){
  let ok = true, first = null;
  ["name","email","address","zip","city"].forEach(k => {
    const fl = $(`[data-f="${k}"]`, drBody); const v = (co.form[k] || "").trim();
    let err = "";
    if (!v) err = t("co.req"); else if (k === "email" && !emailOk(v)) err = t("co.bademail");
    fl.classList.toggle("bad", !!err); $(".err", fl).textContent = err;
    if (err){ ok = false; first = first || $("input", fl); }
  });
  if (first) first.focus({ preventScroll:true });
  return ok;
}
function next(){
  if (co.step === 2 && !validShip()) return;
  co.step = Math.min(3, co.step + 1); renderDrawer(); drBody.scrollTop = 0;
}
drawer.addEventListener("click", e => {
  const rm = e.target.closest("[data-rm]");
  if (rm){ cart.splice(+rm.dataset.rm, 1); saveCart(); updateBag(); renderDrawer(); return; }
  const q = e.target.closest("[data-q]");
  if (q){ const it = cart[+q.dataset.i]; it.qty = clamp(it.qty + (+q.dataset.q), 1, 9); saveCart(); updateBag(); renderDrawer(); return; }
  const pm = e.target.closest("[data-pay]");
  if (pm){ co.pay = pm.dataset.pay; $$(".pay", drawer).forEach(p => p.classList.toggle("on", p === pm)); return; }
  const a = e.target.closest("[data-co]"); if (!a) return;
  const act = a.dataset.co;
  if (act === "next") next();
  else if (act === "back"){ co.step = Math.max(1, co.step - 1); renderDrawer(); }
  else if (act === "goto1"){ co.step = 1; renderDrawer(); }
  else if (act === "goto2"){ co.step = 2; renderDrawer(); }
  else if (act === "config"){ closeDrawer(); goto("configura"); }
  else if (act === "confirm"){
    co.order = { id: "LM-" + (10000 + Math.floor(Math.random()*90000)), first: (co.form.name || "").trim().split(/\s+/)[0] || "" };
    cart = []; saveCart(); updateBag();
    co.step = 4; renderDrawer();
  }
  else if (act === "keep"){ closeDrawer(); }
});

/* =========================================================
   Reveal + visibilità
   ========================================================= */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold:.15, rootMargin:"0px 0px -6% 0px" });
$$(".reveal").forEach(el => io.observe(el));
io.observe($("#steps"));
new IntersectionObserver(es => es.forEach(e => {
  appVisible = e.isIntersecting;
  feats.classList.toggle("paused", !appVisible);
}), { threshold:.3 }).observe($("#app"));
new IntersectionObserver(es => es.forEach(e => { LUME.studio.visible = e.isIntersecting; }), { threshold:0 }).observe(viewer);

/* =========================================================
   Loop
   ========================================================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  storyFrame(dt, now);
  if (popFor) positionPop();
  for (const f of LUME.frames){ try { f(dt, now); } catch(err){ console.error(err); LUME.frames = LUME.frames.filter(x => x !== f); } }
  requestAnimationFrame(loop);
}
addEventListener("scroll", updateNav, { passive:true });
addEventListener("resize", () => { placeFallbackHS(); updateNav(); });

applyI18n();
updateBag();
placeFallbackHS();
updateNav();
setApp(0);
requestAnimationFrame(loop);
})();

<script type="module">
/* =========================================================
   LUME — modulo 3D (three.js r170)
   Geometria ripresa dal modello interattivo: misure in mm
   ricavate in scala dalla tavola EUIPO (G60 = Ø 60 mm).
   Se three.js o WebGL non sono disponibili, il sito resta
   sul disegno 2D di riserva.
   ========================================================= */
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const L = window.LUME;

function hasWebGL(){
  try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); }
  catch(e){ return false; }
}

/* ---------------- misure ---------------- */
const M = {
  base:   { side:140, h:19, r:10 },
  foot:   { d:12, h:2, off:55 },
  pocket: { w:70, d:54, depth:2.5 },
  channel:{ w:7 },
  shell:  { ro:30, ri:23, h:260, gap:5, seatAbove:13 },
};
const FOOT_H = M.foot.h;
const BASE_TOP = FOOT_H + M.base.h;            // 21
const SHELL_TOP = BASE_TOP + M.shell.h;        // 281
const BULB_C = SHELL_TOP + M.shell.seatAbove;  // 294
const SCREWS = [[-31,-23],[31,-23],[-31,23],[31,23]];
const EASE = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const clamp = (v,a=0,b=1) => Math.min(b, Math.max(a, v));

/* ---------------- texture procedurali ---------------- */
function brushedTexture(vertical){
  const c = document.createElement("canvas"); c.width = c.height = 1024;
  const g = c.getContext("2d");
  g.fillStyle = "rgb(128,128,128)"; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 5000; i++){
    const v = Math.random() < .5 ? 255 : 0;
    g.strokeStyle = `rgba(${v},${v},${v},${0.03 + Math.random()*0.09})`;
    g.lineWidth = 0.4 + Math.random()*1.4;
    const p = Math.random()*1024, a = Math.random()*1024, len = 200 + Math.random()*900;
    g.beginPath();
    if (vertical){ g.moveTo(p, a); g.lineTo(p, a + len); } else { g.moveTo(a, p); g.lineTo(a + len, p); }
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}
function radialTexture(stops){
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ---------------- utilità geometria ---------------- */
function flipWinding(geo){
  const idx = geo.index.array;
  for (let i = 0; i < idx.length; i += 3){ const t = idx[i+1]; idx[i+1] = idx[i+2]; idx[i+2] = t; }
  geo.index.needsUpdate = true;
  return geo;
}
function mirrored(geo, sx, sy, sz){
  const g = geo.clone();
  g.applyMatrix4(new THREE.Matrix4().makeScale(sx, sy, sz));
  if (sx*sy*sz < 0) flipWinding(g);
  return g;
}
function lathe(pts, seg, phiStart=0, phiLen=Math.PI*2){
  return new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg, phiStart, phiLen);
}

function boot(){
  if (!L) throw new Error("LUME UI non trovata");
  if (!hasWebGL()) throw new Error("WebGL non disponibile");

  const texShell = brushedTexture(true);
  const texBase = brushedTexture(false);
  texBase.repeat.set(1/140, 1/140);
  const texGlow = radialTexture([[0,"rgba(255,244,225,1)"],[.18,"rgba(255,214,150,.75)"],[.45,"rgba(255,170,80,.22)"],[1,"rgba(255,140,50,0)"]]);
  const texPool = radialTexture([[0,"rgba(255,206,140,.9)"],[.25,"rgba(255,176,95,.42)"],[.55,"rgba(255,150,70,.12)"],[1,"rgba(255,140,50,0)"]]);
  const texCore = radialTexture([[0,"rgba(255,253,246,1)"],[.3,"rgba(255,238,205,.9)"],[.62,"rgba(255,206,145,.32)"],[1,"rgba(255,170,90,0)"]]);
  const texWide = radialTexture([[0,"rgba(255,200,135,.55)"],[.18,"rgba(255,170,95,.22)"],[.45,"rgba(255,150,70,.07)"],[1,"rgba(255,130,50,0)"]]);

  /* ---------------- materiali di finitura ---------------- */
  const INOX = new THREE.Color(0xd9dadc);
  function bodyMat(map, base){
    const m = new THREE.MeshPhysicalMaterial({
      color:INOX.clone(), metalness:1, roughness: base ? .7 : .62, roughnessMap:map,
      anisotropy:.55, anisotropyRotation: base ? Math.PI/2 : 0, envMapIntensity:1,
    });
    m.userData = { base, map, target:INOX.clone() };
    return m;
  }
  function applyFinish(m, f){
    const u = m.userData;
    if (f.finish !== "paint"){
      u.target.copy(INOX);
      m.metalness = 1; m.roughness = u.base ? .7 : .62; m.roughnessMap = u.map;
      m.anisotropy = .55; m.clearcoat = 0;
    } else {
      u.target.set(L.colorHex(f.color));
      m.metalness = 0; m.roughnessMap = null; m.anisotropy = 0;
      if (f.surface === "gloss"){ m.roughness = .26; m.clearcoat = 1; m.clearcoatRoughness = .05; }
      else { m.roughness = .84; m.clearcoat = 0; }
    }
    m.needsUpdate = true;
  }

  /* ---------------- 1. base ---------------- */
  function buildBase(mat){
    const g = new THREE.Group();
    const H = M.base.side/2, R = M.base.r, cw = M.channel.w/2, pw = M.pocket.w/2, pd = M.pocket.d/2;
    const s = new THREE.Shape();
    s.moveTo(cw, H);
    s.lineTo(H-R, H);   s.absarc(H-R,  H-R, R,  Math.PI/2, 0, true);
    s.lineTo(H, -H+R);  s.absarc(H-R, -H+R, R, 0, -Math.PI/2, true);
    s.lineTo(-H+R, -H); s.absarc(-H+R, -H+R, R, -Math.PI/2, -Math.PI, true);
    s.lineTo(-H, H-R);  s.absarc(-H+R, H-R, R, Math.PI, Math.PI/2, true);
    s.lineTo(-cw, H);
    s.lineTo(-cw, pd); s.lineTo(-pw, pd); s.lineTo(-pw, -pd); s.lineTo(pw, -pd); s.lineTo(pw, pd); s.lineTo(cw, pd);
    const low = new THREE.ExtrudeGeometry(s, { depth:4, bevelEnabled:false, curveSegments:20 });
    low.rotateX(-Math.PI/2);

    const b = 1.5, Hu = H - b, Ru = R - b;
    const u = new THREE.Shape();
    u.moveTo(-Hu+Ru, -Hu);
    u.lineTo(Hu-Ru, -Hu);  u.absarc(Hu-Ru, -Hu+Ru, Ru, -Math.PI/2, 0, false);
    u.lineTo(Hu, Hu-Ru);   u.absarc(Hu-Ru, Hu-Ru, Ru, 0, Math.PI/2, false);
    u.lineTo(-Hu+Ru, Hu);  u.absarc(-Hu+Ru, Hu-Ru, Ru, Math.PI/2, Math.PI, false);
    u.lineTo(-Hu, -Hu+Ru); u.absarc(-Hu+Ru, -Hu+Ru, Ru, Math.PI, Math.PI*1.5, false);
    const hole = new THREE.Path(); hole.absarc(0, 0, 5.5, 0, Math.PI*2, true);
    u.holes.push(hole);
    const up = new THREE.ExtrudeGeometry(u, { depth:13.5, bevelEnabled:true, bevelThickness:b, bevelSize:b, bevelSegments:6, curveSegments:24 });
    up.rotateX(-Math.PI/2);

    const mLow = new THREE.Mesh(low, mat); mLow.position.y = FOOT_H;
    const mUp  = new THREE.Mesh(up, mat);  mUp.position.y  = FOOT_H + 4;
    g.add(mLow, mUp);
    return g;
  }

  /* ---------------- 2-3. semigusci ---------------- */
  function shellGeometry(){
    const { ro, ri, h, seatAbove } = M.shell;
    const SR = 30, cy = h + seatAbove;
    const A = [[ro,0],[ro,h-1.5]];
    for (let i = 1; i <= 8; i++){ const a = i/8*Math.PI/2; A.push([ro-1.5+1.5*Math.cos(a), h-1.5+1.5*Math.sin(a)]); }
    const rimR = Math.sqrt(SR*SR - seatAbove*seatAbove);
    A.push([rimR, h]);
    const B = [];
    const p1 = Math.asin(rimR/SR), p2 = Math.asin(ri/SR);
    for (let i = 0; i <= 14; i++){ const p = p1 + (p2-p1)*i/14; B.push([SR*Math.sin(p), cy - SR*Math.cos(p)]); }
    const seatBottom = B[B.length-1][1];
    const C = [[ri, seatBottom],[ri, 0]];
    const D = [[ri, 0],[ro, 0]];
    const parts = [A,B,C,D].map(ch => lathe(ch, 64, 0, Math.PI));
    const poly = [...A, ...B.slice(1), ...C.slice(1)];
    const shape = new THREE.Shape(poly.map(p => new THREE.Vector2(p[0], p[1])));
    const cap1 = new THREE.ShapeGeometry(shape); cap1.rotateY(-Math.PI/2);
    const cap2 = mirrored(cap1, 1, 1, -1);
    return mergeGeometries([...parts, cap1, cap2]);
  }
  const SHELL = shellGeometry();
  function buildShell(side, mat){
    const g = new THREE.Group();
    const geo = side > 0 ? SHELL : mirrored(SHELL, -1, 1, 1);
    const m = new THREE.Mesh(geo, mat);
    m.position.set(side * M.shell.gap/2, BASE_TOP, 0);
    g.add(m);
    return g;
  }

  /* ---------------- 4. lampadina G60 E27 ---------------- */
  function buildBulb(){
    const g = new THREE.Group();
    const cap = [[0,-71],[4,-71],[6,-70.3],[6.6,-69],[9,-68.6],[12.4,-67.4]];
    for (let i = 0; i <= 90; i++){ const y = -67 + i*22/90; cap.push([13.15 + 0.85*Math.sin((y+67)/3.63*Math.PI*2), y]); }
    cap.push([13.6,-44.4],[13.9,-43.4],[13.4,-42.6],[0,-42.6]);
    const mCap = new THREE.Mesh(lathe(cap, 64), new THREE.MeshPhysicalMaterial({ color:0xcfd2d4, metalness:1, roughness:.28 }));
    const contact = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 4.2, 1.2, 32), new THREE.MeshStandardMaterial({ color:0x8a6a3a, metalness:1, roughness:.35 }));
    contact.position.y = -71.4;
    const insul = new THREE.Mesh(lathe([[0,-70.4],[6.2,-70.4],[9.2,-68.6],[0,-68.6]], 48), new THREE.MeshStandardMaterial({ color:0x111111, roughness:.4 }));
    const glass = [[0,-44],[13,-44],[13.3,-42.5],[14,-38.5],[15.4,-34.5],[17.2,-30.6],[18.6,-26.4]];
    const a0 = Math.PI - Math.asin(19.4/30);
    for (let i = 0; i <= 40; i++){ const a = a0 - a0*i/40; glass.push([30*Math.sin(a), 30*Math.cos(a)]); }
    glass[glass.length-1][0] = 0;
    const glassMat = new THREE.MeshPhysicalMaterial({
      color:0xfbf8f3, metalness:0, roughness:.55, transmission:1, thickness:2, ior:1.5,
      attenuationColor:0xfff1de, attenuationDistance:300, emissive:0xffdcae, emissiveIntensity:0,
      sheen:.4, sheenColor:0xffffff,
    });
    const mGlass = new THREE.Mesh(lathe(glass, 72), glassMat);
    const fil = new THREE.Mesh(new THREE.TorusGeometry(9, .6, 8, 48, Math.PI*1.6), new THREE.MeshBasicMaterial({ color:0xffb050, toneMapped:false }));
    fil.rotation.set(0, 0, Math.PI*.2); fil.position.y = 2; fil.visible = false;
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map:texGlow, color:0xffffff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false }));
    halo.scale.set(240, 240, 1);
    // nucleo caldo: il centro del globo opale è più luminoso dei bordi
    const core = new THREE.Sprite(new THREE.SpriteMaterial({ map:texCore, color:0xffffff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false }));
    core.scale.set(70, 70, 1);
    // diffusione ampia nell'aria intorno alla lampada
    const wide = new THREE.Sprite(new THREE.SpriteMaterial({ map:texWide, color:0xffffff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, depthTest:false, toneMapped:false }));
    wide.scale.set(760, 760, 1);
    wide.renderOrder = -1;
    // luce diffusa dentro il vetro opale
    const inner = new THREE.Mesh(new THREE.SphereGeometry(27, 40, 28), new THREE.MeshBasicMaterial({ color:0xffe2b8, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false }));
    g.add(mCap, contact, insul, inner, mGlass, fil, halo, core, wide);
    g.position.y = BULB_C;
    g.userData = { glassMat, fil, halo, core, wide, inner };
    return g;
  }

  /* ---------------- 5. piastra ---------------- */
  function buildPlate(mat){
    const g = new THREE.Group();
    const w = M.pocket.w - 1, d = M.pocket.d - 1, r = 1;
    const s = new THREE.Shape();
    s.moveTo(-w/2+r, -d/2);
    s.lineTo(w/2-r, -d/2); s.absarc(w/2-r, -d/2+r, r, -Math.PI/2, 0, false);
    s.lineTo(w/2, d/2-r);  s.absarc(w/2-r, d/2-r, r, 0, Math.PI/2, false);
    s.lineTo(-w/2+r, d/2); s.absarc(-w/2+r, d/2-r, r, Math.PI/2, Math.PI, false);
    s.lineTo(-w/2, -d/2+r);s.absarc(-w/2+r, -d/2+r, r, Math.PI, Math.PI*1.5, false);
    for (const [x,y] of SCREWS){ const h = new THREE.Path(); h.absarc(x, -y, 1.9, 0, Math.PI*2, true); s.holes.push(h); }
    const geo = new THREE.ExtrudeGeometry(s, { depth:1.6, bevelEnabled:true, bevelThickness:.4, bevelSize:.4, bevelSegments:3, curveSegments:24 });
    geo.rotateX(-Math.PI/2);
    const m = new THREE.Mesh(geo, mat);
    m.position.y = FOOT_H + .4;
    g.add(m);
    return g;
  }

  /* ---------------- 6. viti ---------------- */
  function buildScrews(){
    const g = new THREE.Group();
    const mat = new THREE.MeshPhysicalMaterial({ color:0xc7c9cb, metalness:1, roughness:.3 });
    const slotMat = new THREE.MeshStandardMaterial({ color:0x222222, roughness:.6 });
    const head = lathe([[0,0],[3,0],[3,.25],[1.5,1.7],[0,1.7]], 32);
    const thread = [[0,1.7],[1.25,1.7]];
    for (let i = 0; i <= 60; i++){ const y = 1.7 + i*6/60; thread.push([1.25 + .18*Math.sin(i/60*6/.5*Math.PI*2), y]); }
    thread.push([1,7.9],[0,7.9]);
    const shank = lathe(thread, 24);
    for (const [x,z] of SCREWS){
      const s = new THREE.Group();
      const slot = new THREE.Mesh(new THREE.BoxGeometry(4.2, .6, .6), slotMat); slot.position.y = .28;
      const slot2 = slot.clone(); slot2.rotation.y = Math.PI/2;
      s.add(new THREE.Mesh(head, mat), new THREE.Mesh(shank, mat), slot, slot2);
      s.position.set(x, FOOT_H - .05, z);
      g.add(s);
    }
    return g;
  }

  /* ---------------- 7. piedini ---------------- */
  function buildFeet(){
    const g = new THREE.Group();
    const geo = lathe([[0,0],[5.4,0],[5.9,.3],[6,.8],[6,2],[0,2]], 40);
    const mat = new THREE.MeshPhysicalMaterial({ color:0x1c1c1c, roughness:.85, sheen:.3, sheenColor:0x444444 });
    const o = M.foot.off;
    for (const [x,z] of [[-o,-o],[o,-o],[-o,o],[o,o]]){ const m = new THREE.Mesh(geo, mat); m.position.set(x, 0, z); g.add(m); }
    return g;
  }

  /* ---------------- 8. portalampada ---------------- */
  function buildSocket(){
    const g = new THREE.Group();
    const prof = [[0,-77],[16.5,-77],[18.6,-75.5],[18.6,-63],[18.1,-62.4],[18.1,-60.6],[18.6,-60],[18.6,-44],[18.2,-41.2],[16.6,-40.6],[15,-41],[15,-68],[0,-68]];
    g.add(new THREE.Mesh(lathe(prof, 56), new THREE.MeshPhysicalMaterial({ color:0x1a1a1a, roughness:.38, clearcoat:.3, clearcoatRoughness:.5 })));
    g.position.y = BULB_C;
    return g;
  }

  /* ---------------- 9. cavo ---------------- */
  function buildCable(){
    const g = new THREE.Group();
    const yS = BULB_C - 77;
    const pts = [
      [0,yS,0],[0,yS-60,0],[0,120,0],[0,40,0],[0,14,0],[0,6,-1],
      [0,4.1,-10],[0,3.9,-27],[0,3.9,-50],[0,3.9,-66],[0,3.2,-74],[0,2.4,-86],
      [6,2.2,-120],[26,2.2,-175],[60,2.2,-235],[90,2.2,-300],
    ].map(p => new THREE.Vector3(...p));
    const curve = new THREE.CatmullRomCurve3(pts, false, "centripetal");
    const mat = new THREE.MeshPhysicalMaterial({ color:0x2a2826, roughness:.9, sheen:.6, sheenColor:0x6d6760, sheenRoughness:.6 });
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 360, 2.1, 14, false), mat));
    return g;
  }

  /* ---------------- lampada completa ---------------- */
  function makeLamp({ shadows=false, lightPower=60000, wideOpacity=.32 } = {}){
    const root = new THREE.Group();
    const mats = { shellL:bodyMat(texShell,false), shellR:bodyMat(texShell,false), base:bodyMat(texBase,true), plate:bodyMat(texBase,true) };
    const defs = [
      ["base",   () => buildBase(mats.base),        [0,85,0],    [70, BASE_TOP, 70]],
      ["shellL", () => buildShell(-1, mats.shellL), [-85,110,0], [-30, BASE_TOP+200, 0]],
      ["shellR", () => buildShell(1, mats.shellR),  [85,110,0],  [30, BASE_TOP+200, 0]],
      ["bulb",   buildBulb,                         [0,250,0],   [32, BULB_C+10, 0]],
      ["socket", buildSocket,                       [0,165,0],   [19, BULB_C-58, 0]],
      ["cable",  buildCable,                        [0,85,0],    [60, 3, -235]],
      ["plate",  () => buildPlate(mats.plate),      [0,40,0],    [35, FOOT_H, 27]],
      ["screws", buildScrews,                       [0,8,0],     [31, FOOT_H, 23]],
      ["feet",   buildFeet,                         [0,55,0],    [55, 0, 55]],
    ];
    const parts = {};
    for (const [id, build, ex, an] of defs){
      const group = build();
      const r = new THREE.Group(); r.add(group); root.add(r);
      const set = new Set();
      group.traverse(o => {
        if (!o.isMesh) return;
        if (shadows){ o.castShadow = true; o.receiveShadow = true; }
        if (id !== "bulb" && o.material && o.material.emissive) set.add(o.material);
      });
      parts[id] = { id, group, root:r, ex:new THREE.Vector3(...ex), anchor:new THREE.Vector3(...an), mats:[...set], hl:0 };
    }
    const bulb = parts.bulb.group.userData;
    const light = new THREE.PointLight(0xffc387, 0, 0, 2);   // circa 2700 K
    light.position.y = BULB_C + 4;
    parts.bulb.root.add(light);
    const fill = new THREE.PointLight(0xffb070, 0, 0, 2);
    fill.position.y = BULB_C - 22;
    parts.bulb.root.add(fill);

    const strip = new THREE.Mesh(new THREE.BoxGeometry(4.6, 250, 44),
      new THREE.MeshBasicMaterial({ color:0xffd29c, transparent:true, opacity:0, depthWrite:false, toneMapped:false, blending:THREE.AdditiveBlending }));
    strip.position.y = BASE_TOP + 4 + 125;
    strip.visible = false;
    root.add(strip);

    const lamp = {
      root, parts, e:0, k:0,
      setFinish(f){ Object.values(mats).forEach(m => applyFinish(m, f)); },
      setExplode(e){
        this.e = e; const s = EASE(clamp(e));
        for (const p of Object.values(parts)) p.root.position.copy(p.ex).multiplyScalar(s);
        this._strip();
      },
      setLight(k){
        this.k = k;
        const kk = k*k*(3 - 2*k);               // accensione morbida, come un LED dimmerabile
        bulb.glassMat.emissiveIntensity = 3.4*kk;
        bulb.glassMat.transmission = 1 - .85*kk;
        bulb.glassMat.roughness = .55 + .3*kk;   // da acceso il vetro opale sembra più "pieno"
        bulb.fil.visible = false;                // vetro opale: il filamento non si vede
        bulb.inner.material.opacity = .55*kk;
        bulb.core.material.opacity = .95*kk;
        bulb.halo.material.opacity = .62*kk;
        const sc = 150 + 150*kk; bulb.halo.scale.set(sc, sc, 1);
        bulb.wide.material.opacity = wideOpacity*kk;
        light.intensity = lightPower*kk;
        fill.intensity = lightPower*.18*kk;
        this._strip();
      },
      _strip(){
        const o = this.k * Math.pow(1 - clamp(this.e), 3) * .95;
        strip.material.opacity = o; strip.visible = o > .01;
      },
      setHighlight(map){
        for (const p of Object.values(parts)){
          const w = (map && map[p.id]) || 0;
          if (Math.abs(w - p.hl) < .002) continue;
          p.hl = w;
          for (const m of p.mats){ m.emissive.setRGB(.6, .36, .14); m.emissiveIntensity = w*.55; }
        }
      },
      update(dt){
        const a = 1 - Math.exp(-dt*9);
        Object.values(mats).forEach(m => m.color.lerp(m.userData.target, a));
      },
      worldAnchor(id, out){
        const p = parts[id];
        return out.copy(p.anchor).add(p.root.position);
      },
    };
    return lamp;
  }

  function makeRenderer(pr){
    const r = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:"high-performance" });
    r.setPixelRatio(Math.min(devicePixelRatio || 1, pr));
    r.setClearColor(0x000000, 0);
    r.toneMapping = THREE.ACESFilmicToneMapping;
    r.toneMappingExposure = 1;
    return r;
  }
  function environment(renderer, scene, intensity){
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(new RoomEnvironment(), .04).texture;
    scene.environmentIntensity = intensity;
    pm.dispose();
  }

  /* =========================================================
     STORY (hero + esploso)
     ========================================================= */
  const stage = document.getElementById("stage");
  const sR = makeRenderer(1.75);
  stage.insertBefore(sR.domElement, document.getElementById("tags"));
  const sScene = new THREE.Scene();
  environment(sR, sScene, .55);
  sScene.add(new THREE.HemisphereLight(0xffffff, 0x2a2520, .25));
  const sKey = new THREE.DirectionalLight(0xfff3e2, 1.35); sKey.position.set(380, 900, 520); sScene.add(sKey);
  const sRim = new THREE.DirectionalLight(0xdfe8ff, .85); sRim.position.set(-600, 400, -700); sScene.add(sRim);
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(900, 900),
    new THREE.MeshBasicMaterial({ map:texPool, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false }));
  pool.rotation.x = -Math.PI/2; pool.position.y = .3;
  sScene.add(pool);
  const sLamp = makeLamp({ lightPower:70000, wideOpacity:.36 });
  sLamp.setFinish({ finish:"inox" });
  sScene.add(sLamp.root);
  const sCam = new THREE.PerspectiveCamera(30, 1, 5, 20000);
  const tagEls = {};
  document.querySelectorAll(".ptag").forEach(el => { tagEls[el.dataset.part] = el; });
  let sW = 0, sH = 0;
  function sizeStory(){
    const w = stage.clientWidth, h = stage.clientHeight;
    if (w === sW && h === sH) return;
    sW = w; sH = h;
    sR.setSize(w, h, false);
    sCam.aspect = w / h; sCam.updateProjectionMatrix();
  }
  const v3 = new THREE.Vector3();
  let sLv = 0;
  function storyFrame(dt, now){
    const s = L.story;
    if (!s.visible || s.th === undefined) return;
    sizeStory();
    let { th, ph, r, ty, e, sx } = s;
    const aspect = sW / sH;
    if (aspect < .8) r *= 1 + (.8 - aspect) * .9;
    const hero = s.hero || 0;
    th += Math.sin(now * .00025) * .06 * hero + L.pointer.x * .08 * hero;
    ph += L.pointer.y * .03 * hero;
    sCam.position.set(Math.sin(th)*Math.cos(ph)*r, ty + Math.sin(ph)*r, Math.cos(th)*Math.cos(ph)*r);
    sCam.lookAt(0, ty, 0);
    const shift = sW > 900 ? -sx * .17 * sW : 0;
    if (Math.abs(shift) > .5) sCam.setViewOffset(sW, sH, shift, 0, sW, sH); else sCam.clearViewOffset();

    sLv += (s.L - sLv) * (1 - Math.exp(-dt * 10));
    sLamp.setExplode(e);
    sLamp.setLight(sLv);
    sLamp.setHighlight(s.hl);
    sLamp.update(dt);
    pool.material.opacity = sLv * .62 * (1 - e*.7);
    const lv = sLv*sLv*(3 - 2*sLv);
    sKey.intensity = 1.35 - .55*lv;
    sRim.intensity = .85 - .35*lv;
    sScene.environmentIntensity = .55 - .22*lv;
    sR.toneMappingExposure = 1 + .12*lv;
    // posizione della lampadina sullo schermo: lì si centra la luce sulla parete
    v3.set(0, BULB_C, 0).add(sLamp.parts.bulb.root.position).project(sCam);
    stage.style.setProperty("--bx", ((v3.x*.5 + .5)*100).toFixed(2) + "%");
    stage.style.setProperty("--by", ((-v3.y*.5 + .5)*100).toFixed(2) + "%");

    sCam.updateMatrixWorld();
    for (const id in tagEls){
      const el = tagEls[id];
      const vis = (s.tagVis && s.tagVis[id]) || 0;
      if (vis < .01){ if (el.style.opacity !== "0") el.style.opacity = "0"; continue; }
      sLamp.worldAnchor(id, v3).project(sCam);
      if (v3.z > 1){ el.style.opacity = "0"; continue; }
      const x = (v3.x * .5 + .5) * sW, y = (-v3.y * .5 + .5) * sH;
      el.style.transform = `translate(${x.toFixed(1)}px, ${(y - 7).toFixed(1)}px)`;
      el.style.opacity = vis.toFixed(3);
    }
    sR.render(sScene, sCam);
  }

  /* =========================================================
     STUDIO (configuratore)
     ========================================================= */
  const viewer = document.getElementById("viewer");
  const vR = makeRenderer(2);
  vR.shadowMap.enabled = true;
  vR.shadowMap.type = THREE.PCFSoftShadowMap;
  viewer.insertBefore(vR.domElement, viewer.firstChild);
  const vScene = new THREE.Scene();
  environment(vR, vScene, .95);
  vScene.add(new THREE.HemisphereLight(0xffffff, 0xcbbfae, .35));
  const vKey = new THREE.DirectionalLight(0xfff6ea, 2.1);
  vKey.position.set(380, 900, 520); vKey.castShadow = true;
  vKey.shadow.mapSize.set(2048, 2048);
  Object.assign(vKey.shadow.camera, { left:-320, right:320, top:320, bottom:-320, near:100, far:2500 });
  vKey.shadow.bias = -.0004; vKey.shadow.normalBias = .6; vKey.shadow.radius = 5;
  vScene.add(vKey);
  const vRim = new THREE.DirectionalLight(0xdfe8ff, .85); vRim.position.set(-600, 400, -700); vScene.add(vRim);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShadowMaterial({ opacity:.17 }));
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; vScene.add(floor);
  const vLamp = makeLamp({ shadows:true, lightPower:45000, wideOpacity:.12 });
  vLamp.setFinish(L.cfg);
  vLamp.parts.cable.root.visible = true;
  vScene.add(vLamp.root);

  const vCam = new THREE.PerspectiveCamera(30, 1, 5, 20000);
  const TARGET = new THREE.Vector3(0, 152, 0);
  const DEF_DIR = new THREE.Vector3(Math.sin(.6)*Math.cos(.2), Math.sin(.2), Math.cos(.6)*Math.cos(.2)).normalize();
  const controls = new OrbitControls(vCam, vR.domElement);
  controls.target.copy(TARGET);
  controls.enableDamping = true; controls.dampingFactor = .08;
  controls.enableZoom = false; controls.enablePan = false;
  controls.autoRotate = true; controls.autoRotateSpeed = .9;
  controls.minPolarAngle = .2; controls.maxPolarAngle = 1.72;
  vR.domElement.style.touchAction = "pan-y";
  let resumeT = null;
  controls.addEventListener("start", () => { controls.autoRotate = false; clearTimeout(resumeT); });
  controls.addEventListener("end", () => { clearTimeout(resumeT); resumeT = setTimeout(() => { controls.autoRotate = true; }, 2600); });

  let vW = 0, vH = 0, fitDist = 1000;
  function sizeViewer(){
    const w = viewer.clientWidth, h = viewer.clientHeight;
    if (w === vW && h === vH) return false;
    const first = vW === 0;
    vW = w; vH = h;
    vR.setSize(w, h, false);
    vCam.aspect = w / h; vCam.updateProjectionMatrix();
    const fv = THREE.MathUtils.degToRad(vCam.fov);
    const fh = 2 * Math.atan(Math.tan(fv/2) * vCam.aspect);
    fitDist = 215 / Math.sin(Math.min(fv, fh) / 2) * 1.04;
    if (first) vCam.position.copy(TARGET).addScaledVector(DEF_DIR, fitDist);
    else { const d = vCam.position.clone().sub(controls.target).normalize(); vCam.position.copy(controls.target).addScaledVector(d, fitDist); }
    return true;
  }
  const fly = { on:false, t:0, from:new THREE.Vector3(), to:new THREE.Vector3() };
  function flyHome(){
    fly.from.copy(vCam.position);
    fly.to.copy(TARGET).addScaledVector(DEF_DIR, fitDist);
    fly.t = 0; fly.on = true;
    controls.autoRotate = false;
    clearTimeout(resumeT); resumeT = setTimeout(() => { controls.autoRotate = true; }, 2600);
  }

  const HS = [
    { n:1, p:new THREE.Vector3(16, 286, 22),  d:new THREE.Vector3(.35, .6, .7) },
    { n:2, p:new THREE.Vector3(0, 165, 30.5), d:new THREE.Vector3(0, 0, 1) },
    { n:3, p:new THREE.Vector3(62, 21, 62),   d:new THREE.Vector3(.6, .5, .6) },
    { n:4, p:new THREE.Vector3(0, 6, -70),    d:new THREE.Vector3(0, .15, -1) },
  ];
  HS.forEach(h => { h.d.normalize(); h.el = viewer.querySelector(`.hs[data-hs="${h.n}"]`); });

  let vTarget = 0, vLv = 0, spinBoost = 0;
  L.on("config", c => { vLamp.setFinish(c); spinBoost = 1; });
  L.on("studio-light", on => { vTarget = on ? 1 : 0; });
  L.on("studio-reset", flyHome);
  L.on("explore", () => { flyHome(); spinBoost = 1.6; });
  vTarget = L.studio.light ? 1 : 0;

  const tmp = new THREE.Vector3(), toCam = new THREE.Vector3();
  function studioFrame(dt){
    if (!L.studio.visible){ return; }
    sizeViewer();
    if (fly.on){
      fly.t = Math.min(1, fly.t + dt/1.1);
      vCam.position.lerpVectors(fly.from, fly.to, EASE(fly.t));
      if (fly.t >= 1) fly.on = false;
    }
    spinBoost = Math.max(0, spinBoost - dt*.8);
    controls.autoRotateSpeed = .9 + spinBoost * 6;
    controls.update(dt);
    vLv += (vTarget - vLv) * (1 - Math.exp(-dt * 7));
    vLamp.setLight(vLv);
    vLamp.update(dt);
    vKey.intensity = 2.1 - .6*vLv;
    for (const h of HS){
      if (!h.el) continue;
      tmp.copy(h.p).project(vCam);
      const x = (tmp.x * .5 + .5) * vW, y = (-tmp.y * .5 + .5) * vH;
      toCam.copy(vCam.position).sub(h.p).normalize();
      const facing = toCam.dot(h.d) > .08 && tmp.z < 1;
      h.el.style.left = x.toFixed(1) + "px"; h.el.style.top = y.toFixed(1) + "px";
      h.el.classList.toggle("hide", !facing);
    }
    vR.render(vScene, vCam);
  }

  /* avvio */
  sizeStory(); sizeViewer();
  L.frames.push(storyFrame, studioFrame);
  L.ready3D();
}

try { boot(); }
catch(err){
  console.warn("LUME 3D non avviato, resta il disegno 2D:", err && err.message);
  document.querySelectorAll("#stage canvas, #viewer canvas").forEach(c => c.remove());
}
</script>

</body>
</html>
