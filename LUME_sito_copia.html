<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUME — Lampada da tavolo in acciaio</title>
<meta name="description" content="LUME. Lampada da tavolo in acciaio inox AISI 304: una base, due semigusci e una lampadina che si appoggia. Design Oscar Preatoni.">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
<style>
/* =========================================================
   LUME — design tokens
   ========================================================= */
:root{
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ink:#161513; --ink-2:#3a3733; --muted:#7b756c; --line:rgba(22,21,19,.11);
  --paper:#f5f2ed; --paper-2:#ece7e0; --white:#fbfaf8;
  --dark:#0c0b0a; --dark-2:#161412; --dark-line:rgba(255,248,235,.12); --dark-muted:#9c958a;
  --warm:#ffd49a; --copper:#b8743a;
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --ease-io: cubic-bezier(.65,0,.35,1);
  --r-lg:24px; --r-md:16px; --r-sm:12px;
  --g:1; /* livello di luce del titolo, guidato da JS */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:1.5;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img,svg{display:block}
::selection{background:var(--warm);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px;border-radius:6px}

.wrap{width:min(1240px, calc(100% - 48px));margin:0 auto}
.eyebrow{font-size:14px;letter-spacing:0;color:var(--muted);font-weight:500;margin:0 0 16px}
.dark .eyebrow{color:var(--dark-muted)}
.h-xl{font-size:clamp(40px,6vw,84px);line-height:1.02;letter-spacing:-.025em;font-weight:500;margin:0}
.h-lg{font-size:clamp(32px,4.2vw,56px);line-height:1.05;letter-spacing:-.02em;font-weight:500;margin:0}
.lead{font-size:clamp(17px,1.5vw,21px);line-height:1.45;color:var(--ink-2);max-width:38em;margin:22px 0 0}
.dark .lead{color:#c9c2b6}
section{position:relative}
.dark{background:var(--dark);color:#f3eee6}

/* giapponese e cinese: font di sistema con i caratteri CJK, niente spaziature strette */
:lang(ja) body{font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;line-break:strict}
:lang(zh-Hans) body{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;line-break:strict}
:lang(ja) .h-xl,:lang(ja) .h-lg,:lang(ja) .quote,:lang(ja) .chapter h2,:lang(ja) .outro h2,
:lang(zh-Hans) .h-xl,:lang(zh-Hans) .h-lg,:lang(zh-Hans) .quote,:lang(zh-Hans) .chapter h2,:lang(zh-Hans) .outro h2{letter-spacing:0;line-height:1.25}

/* bottoni */
/* sui bottoni scuri: un filo di luce in alto invece del bagliore */
.btn-primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 24px;border-radius:999px;font-size:15px;font-weight:500;letter-spacing:.005em;transition:transform .5s var(--ease-out), background .3s var(--ease), color .3s var(--ease), box-shadow .4s var(--ease);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#000}
.dark .btn-primary,.btn-light{background:#f6f1e8;color:var(--ink)}
.dark .btn-primary:hover,.btn-light:hover{background:#fff}
.btn-ghost{border:1px solid currentColor;color:inherit;opacity:.9}
.btn-ghost:hover{opacity:1;background:rgba(127,127,127,.08)}
.btn-text{height:auto;padding:0;border-radius:0;font-weight:500;gap:6px}
.btn-text .arr{transition:transform .4s var(--ease-out)}
.btn-text:hover .arr{transform:translateX(4px)}
.btn[disabled]{opacity:.35;pointer-events:none}

/* reveal allo scroll */
.reveal{opacity:0;transform:translateY(12px);transition:opacity .8s var(--ease-out), transform .8s var(--ease-out)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}.reveal.d4{transition-delay:.32s}

/* =========================================================
   NAV
   ========================================================= */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;
  color:#f3eee6;background:rgba(12,11,10,.42);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);
  border-bottom:1px solid transparent;transition:background .5s var(--ease), color .5s var(--ease), border-color .5s var(--ease), transform .5s var(--ease-out)}
.nav.light{color:var(--ink);background:rgba(245,242,237,.78);border-bottom-color:var(--line)}
.nav .logo{font-size:15px;font-weight:600;letter-spacing:.42em;justify-self:start;padding-left:.42em;text-shadow:0 0 calc(var(--g)*12px) rgba(255,205,140,calc(var(--g)*.55))}
.nav.light .logo{text-shadow:none}
.nav ul{display:flex;gap:30px;list-style:none;margin:0;padding:0;font-size:13px}
.nav ul button{opacity:.72;transition:opacity .25s}
.nav ul button:hover,.nav ul button.on{opacity:1}
.nav .acts{justify-self:end;display:flex;align-items:center;gap:14px}
.lang{position:relative}
.lang select{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid currentColor;border-radius:999px;height:30px;padding:0 26px 0 12px;font-size:12px;font-weight:500;letter-spacing:.06em;opacity:.8;cursor:pointer}
.lang select option{color:var(--ink)}
.lang::after{content:"";position:absolute;right:11px;top:12px;width:5px;height:5px;border-right:1.4px solid currentColor;border-bottom:1.4px solid currentColor;transform:rotate(45deg);pointer-events:none;opacity:.8}
.bag{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.bag:hover{background:rgba(127,127,127,.14)}
.bag .count{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--copper);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;transform:scale(0);transition:transform .45s var(--ease-out)}
.bag .count.on{transform:scale(1)}
.bag.bump{animation:bump .6s var(--ease-out)}
@keyframes bump{30%{transform:scale(1.22)}}
.nav .btn{height:34px;padding:0 16px;font-size:13px}
.nav.light .btn-light{background:var(--ink);color:#fff}

/* =========================================================
   STORY (hero + esploso a scroll)
   ========================================================= */
#design{height:680vh;background:var(--dark);color:#f3eee6}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 62%, #1d1a16 0%, #0e0d0c 55%, #090807 100%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block}
.stage .fb{position:absolute;left:50%;top:17vh;height:50vh;transform:translateX(-50%);z-index:1;pointer-events:none}
.has-3d .stage .fb,.has-3d #viewer .fb{display:none}
.hero-title{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
/* titolo calligrafico (pennino a punta, disegnato in vettoriale) */
.glow{display:flex;align-items:flex-end;gap:clamp(18px,3vw,56px);margin:0;line-height:1;
  color:hsl(36 45% calc(80% + var(--g)*14%));
  filter:
    drop-shadow(0 0 calc(1px + var(--g)*3px) rgba(255,240,215,calc(.2 + var(--g)*.6)))
    drop-shadow(0 0 calc(var(--g)*16px) rgba(255,196,120,calc(var(--g)*.7)))
    drop-shadow(0 0 calc(var(--g)*44px) rgba(255,160,75,calc(var(--g)*.45)));
  transform:translateY(-3vh)}
.glow span{display:block}
.glow svg{display:block;height:clamp(150px,27vw,400px);width:auto;fill:currentColor;overflow:visible}
.glow .w-lu{margin-right:clamp(30px,5vw,90px)}
.hero-ui{position:absolute;inset:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(56px + 7vh) 24px 5vh;text-align:center}
.hero-ui > *{pointer-events:auto}
.hero-top .eyebrow{color:#b9b1a5;margin:0}
.hero-bottom{display:flex;flex-direction:column;align-items:center;gap:18px}
.hero-bottom .tag-line{font-size:clamp(19px,2vw,26px);font-weight:400;letter-spacing:-.01em;margin:0;color:#f3eee6}
.hero-bottom .sub{font-size:15px;color:#a9a195;margin:0;max-width:34em}
.hero-bottom .ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.hero-bottom .price{font-size:13px;color:#a9a195;margin:0}
.scroll-cue{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:#8f887d;margin-top:8px}
.scroll-cue i{width:1px;height:34px;background:linear-gradient(#8f887d,transparent);position:relative;overflow:hidden}
.scroll-cue i::after{display:none}
@keyframes cue{to{top:34px}}
.room{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at var(--bx,50%) var(--by,26%), rgba(255,214,160,calc(var(--bl,0)*.22)) 0, rgba(255,184,110,calc(var(--bl,0)*.12)) 12%, rgba(255,160,80,calc(var(--bl,0)*.05)) 32%, transparent 62%),
    radial-gradient(ellipse 60% 22% at var(--bx,50%) 88%, rgba(255,180,110,calc(var(--bl,0)*.10)), transparent 70%)}
.hero-spot{display:none}

.chapter{position:absolute;z-index:3;left:max(24px,6vw);top:50%;width:min(400px,36vw);opacity:0;transform:translateY(-50%);pointer-events:none;will-change:opacity,transform}
.chapter .k{font-size:14px;letter-spacing:0;color:#d9a768;margin:0 0 16px;font-variant-numeric:tabular-nums}
.chapter h2{font-size:clamp(32px,3.6vw,52px);line-height:1.04;letter-spacing:-.02em;font-weight:500;margin:0}
.chapter p{font-size:17px;line-height:1.55;color:#bdb5a9;margin:18px 0 0}
.outro{position:absolute;z-index:3;left:0;right:0;bottom:12vh;text-align:center;opacity:0;pointer-events:none}
.outro h2{font-size:clamp(36px,5vw,72px);font-weight:500;letter-spacing:-.025em;margin:0}
.outro p{color:#a9a195;margin:12px 0 0;font-size:17px}
.rail{position:absolute;z-index:3;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;opacity:0;transition:opacity .5s}
.rail button{width:8px;height:8px;border-radius:50%;background:rgba(255,248,235,.25);transition:background .3s, transform .4s var(--ease-out)}
.rail button.on{background:#ffd49a;transform:scale(1.5)}
.ptag{position:absolute;left:0;top:0;z-index:2;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:#e9e3d9;white-space:nowrap;pointer-events:none;opacity:0;will-change:transform,opacity}
.ptag i{width:7px;height:7px;border-radius:50%;background:#ffd49a;box-shadow:0 0 12px #ffb35c;flex:none}
.ptag span{background:rgba(20,18,16,.72);border:1px solid rgba(255,248,235,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:4px 10px;border-radius:999px}
.no-3d .ptag{display:none}

/* =========================================================
   CONFIGURATORE
   ========================================================= */
#configura{padding:150px 0 120px;background:var(--paper)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:48px}
.sec-head .lead{margin:0;max-width:30em}
.cfg{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(330px,1fr);gap:28px;align-items:start}
#viewer{position:sticky;top:76px;height:min(78vh,760px);border-radius:var(--r-lg);overflow:hidden;
  background:radial-gradient(90% 70% at 50% 40%, #fbfaf7 0%, #efebe4 60%, #e4ded5 100%);isolation:isolate}
#viewer canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#viewer canvas:active{cursor:grabbing}
#viewer .fb{position:absolute;left:50%;top:50%;height:80%;transform:translate(-50%,-50%)}
.v-tools{position:absolute;left:18px;right:18px;bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:4;pointer-events:none}
.v-tools > *{pointer-events:auto}
.v-hint{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.no-3d .v-hint{visibility:hidden}
.v-btns{display:flex;gap:8px}
.chip{height:34px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:500;background:rgba(255,255,255,.75);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .25s, color .25s, border-color .25s;display:inline-flex;align-items:center;gap:7px}
.chip:hover{background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip svg{width:14px;height:14px}
.no-3d [data-act="reset"]{display:none}
.v-badge{position:absolute;top:18px;left:18px;z-index:4;font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px}
.v-badge i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.hs{position:absolute;z-index:3;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;display:grid;place-items:center;transition:opacity .35s, transform .45s var(--ease-out)}
.hs::before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 4px 18px -4px rgba(0,0,0,.3)}
.hs::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(22,21,19,.14)}
.hs b{position:relative;font-size:18px;font-weight:300;line-height:1;transition:transform .4s var(--ease-out)}
.hs:hover::before{background:#fff}
.hs.open b{transform:rotate(45deg)}
.hs.hide{opacity:0;pointer-events:none;transform:scale(.6)}
#viewer.nohs .hs{opacity:0;pointer-events:none}
@keyframes ping{0%{transform:scale(.7);opacity:.9}80%,100%{transform:scale(1.5);opacity:0}}
.pop{position:absolute;z-index:5;width:260px;padding:18px 18px 16px;border-radius:var(--r-md);background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 24px 60px -20px rgba(0,0,0,.35);opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:opacity .35s var(--ease), transform .45s var(--ease-out)}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop h4{margin:0 0 6px;font-size:15px;font-weight:600}
.pop p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.pop .n{font-size:12px;color:var(--copper);font-weight:500;margin-bottom:8px;font-variant-numeric:tabular-nums}

.panel{display:flex;flex-direction:column;gap:32px;padding:4px 4px 0}
.grp h3{font-size:13px;font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.grp h3 small{font-weight:400;color:var(--muted);font-size:13px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;text-align:left;padding:16px 16px 15px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--white);transition:border-color .3s, box-shadow .3s, transform .4s var(--ease-out)}
.opt:hover{border-color:rgba(22,21,19,.3)}
.opt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.opt .sw{width:30px;height:30px;border-radius:50%;margin-bottom:12px;border:1px solid rgba(0,0,0,.08)}
.opt .sw.inox{background:linear-gradient(115deg,#8e9094 0%,#eceef0 32%,#a9abae 55%,#f4f5f6 78%,#9a9ca0 100%)}
.opt .sw.paint{background:conic-gradient(#a9bda0,#ebd58e,#c9574b,#6b2333,#8fa8c8,#232220,#f2f0eb,#d9c9af,#a9bda0)}
.opt b{display:block;font-size:14.5px;font-weight:600}
.opt span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.opt .pr{position:absolute;top:16px;right:16px;font-size:13px;color:var(--ink-2);font-weight:500;font-style:normal;font-variant-numeric:tabular-nums}
.collapse{display:grid;grid-template-rows:1fr;transition:grid-template-rows .6s var(--ease-out), opacity .4s var(--ease)}
.collapse > div{overflow:hidden;display:flex;flex-direction:column;gap:32px;padding:6px;margin:-6px}
.collapse.shut{grid-template-rows:0fr;opacity:0}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--paper-2);position:relative}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--white);box-shadow:0 2px 8px -2px rgba(0,0,0,.18);transition:transform .5s var(--ease-out)}
.seg.right .thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;height:38px;font-size:13.5px;font-weight:500;color:var(--muted);transition:color .3s}
.seg button.on{color:var(--ink)}
.seg button em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:400;opacity:.7;margin-left:6px;font-size:12px}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.swc{aspect-ratio:1;border-radius:50%;position:relative;transition:transform .45s var(--ease-out)}
.swc i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(0,0,0,.1);overflow:hidden}
.swc.gloss i::after{content:"";position:absolute;left:14%;top:10%;width:45%;height:30%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.75),transparent);transform:rotate(-25deg)}
.swc::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--ink);opacity:0;transform:scale(.85);transition:opacity .3s, transform .45s var(--ease-out)}
.swc:hover::before{opacity:.35;transform:none}
.swc.on::before{opacity:1;transform:none}
.toggle-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.toggle-row:last-child{border-bottom:1px solid var(--line)}
.toggle-row .tx{flex:1}
.toggle-row b{display:block;font-size:14.5px;font-weight:500}
.toggle-row span{display:block;font-size:12.5px;color:var(--muted)}
.toggle-row .pr{font-size:13px;color:var(--ink-2);font-weight:500}
.sw-t{width:44px;height:26px;border-radius:13px;background:#d4cec5;position:relative;flex:none;transition:background .35s var(--ease)}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .45s var(--ease-out)}
.toggle-row[aria-checked="true"] .sw-t{background:var(--ink)}
.toggle-row[aria-checked="true"] .sw-t::after{transform:translateX(18px)}
.summary{border-radius:var(--r-lg);background:var(--white);padding:24px;border:1px solid var(--line)}
.summary .desc{font-size:13.5px;color:var(--muted);margin:0 0 4px;min-height:1.5em}
.summary .tot{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 4px}
.summary .tot span{font-size:14px;font-weight:500}
.summary .tot strong{font-size:34px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.summary .vat{font-size:12.5px;color:var(--muted);margin:0 0 18px}
.summary .btn{width:100%;height:52px;font-size:16px}
.summary .note{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--ink-2);margin:12px 0 0}
.summary .note i{width:6px;height:6px;border-radius:50%;background:#5e9b62}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.trust div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.3}
.trust svg{width:20px;height:20px;stroke:var(--ink-2)}
.btn.flash{animation:flash 1.2s var(--ease-out)}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(184,116,58,0)}30%{box-shadow:0 0 0 8px rgba(184,116,58,.25)}}

/* =========================================================
   DETTAGLI
   ========================================================= */
#dettagli{padding:120px 0 140px;background:var(--paper)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 24px 32px;min-height:328px;display:flex;flex-direction:column;transition:border-color .3s var(--ease)}
.card:hover{border-color:rgba(22,21,19,.22)}
.card .ic{height:112px;display:flex;align-items:center;margin-bottom:32px}
.card .ic svg{height:100%;width:auto;stroke:var(--ink);fill:none;stroke-width:1.1}
.card .no{font-size:13px;color:var(--copper);font-weight:500;margin:0 0 8px;font-variant-numeric:tabular-nums}
.card h3{font-size:20px;font-weight:500;letter-spacing:-.01em;margin:0 0 10px}
.card p{font-size:14.5px;line-height:1.55;color:var(--ink-2);margin:0}

/* =========================================================
   APP
   ========================================================= */
#app{padding:150px 0;overflow:hidden}
.app-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,420px);gap:80px;align-items:center}
.app-grid > *{min-width:0}
.feats{list-style:none;margin:44px 0 0;padding:0;border-top:1px solid var(--dark-line)}
.feats li{border-bottom:1px solid var(--dark-line);position:relative}
.feats button{width:100%;text-align:left;padding:20px 0 20px;display:grid;grid-template-columns:1fr;gap:4px;position:relative;opacity:.5;transition:opacity .4s}
.feats button:hover{opacity:.8}
.feats li.on button{opacity:1}
.feats b{font-size:18px;font-weight:500}
.feats span{font-size:14.5px;color:#a9a195}
.feats .bar{position:absolute;left:0;bottom:-1px;height:1px;width:100%;background:transparent;overflow:hidden}
.feats li.on .bar::after{content:"";position:absolute;inset:0;background:#ffd49a;transform-origin:left;animation:fill 6s linear forwards}
.feats.paused li.on .bar::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.compat{font-size:13px;color:#8f887d;margin:26px 0 0}
.phone{position:relative;width:min(340px,100%);aspect-ratio:9/19;margin:0 auto;border-radius:52px;padding:12px;background:linear-gradient(145deg,#2b2925,#0f0e0d 40%,#24221f);
  box-shadow:0 0 0 1.5px #3a3732 inset, 0 60px 120px -40px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:41px;overflow:hidden;background:#0f0e0d}
.phone .isl{position:absolute;top:12px;left:50%;width:96px;height:28px;border-radius:20px;background:#000;transform:translateX(-50%);z-index:5}
.phone .stat{position:absolute;top:14px;left:28px;right:28px;display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;z-index:4;color:#eee}
.screens{display:flex;height:100%;transition:transform .8s var(--ease-out);touch-action:pan-y}
.screen{flex:0 0 100%;height:100%;padding:62px 20px 22px;display:flex;flex-direction:column;gap:14px;color:#f0ebe2;font-size:13px}
.screen .ttl{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:6px 0 2px}
.screen .subt{color:#8f887d;font-size:12.5px;margin-top:-10px}
.tile{background:#1c1a17;border-radius:20px;padding:14px 16px}
.dim{flex:1;display:grid;grid-template-columns:1fr 92px;gap:14px;min-height:0}
.dim .info{display:flex;flex-direction:column;justify-content:space-between}
.dim .pct{font-size:52px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.dim .pct small{font-size:20px;color:#8f887d;margin-left:2px}
.dim .bulb{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 50% 45%, #fff6e6 0%, #ffcf8a 40%, #e9963a 70%, transparent 72%);filter:drop-shadow(0 0 calc(var(--lv)*30px) rgba(255,190,100,calc(var(--lv)*.9)));opacity:calc(.25 + var(--lv)*.75);transition:opacity .2s}
.dim .track{position:relative;border-radius:30px;background:#26231f;overflow:hidden;cursor:ns-resize;touch-action:none}
.dim .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffe2b4,#f2b066);height:calc(var(--lv)*100%)}
.dim .knob{position:absolute;left:50%;width:30px;height:4px;border-radius:2px;background:rgba(0,0,0,.25);bottom:calc(var(--lv)*100% - 14px);transform:translateX(-50%)}
.temps{display:flex;gap:6px}
.temps button{flex:1;height:34px;border-radius:12px;background:#1c1a17;font-size:12px;color:#bdb5a9;transition:background .25s,color .25s}
.temps button.on{background:#f0ebe2;color:#111}
.pw{display:flex;justify-content:space-between;align-items:center}
.pw .sw-t{background:#3a3631}
.pw[aria-checked="true"] .sw-t{background:#f2b066}
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene{border-radius:20px;padding:16px 14px;background:#1c1a17;text-align:left;display:flex;flex-direction:column;gap:22px;transition:background .3s, color .3s}
.scene i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#ffd49a calc(var(--s)*60%),transparent calc(var(--s)*60% + 1%));border:1px solid #47423b}
.scene b{font-size:14px;font-weight:600}
.scene span{font-size:12px;color:#8f887d}
.scene.on{background:#f0ebe2;color:#111}
.scene.on span{color:#6b655c}
.rt{display:flex;align-items:center;gap:12px}
.rt .tx{flex:1}
.rt b{display:block;font-size:14px;font-weight:600}
.rt span{display:block;font-size:12px;color:#8f887d}
.rt .sw-t{background:#3a3631;cursor:pointer}
.rt[aria-checked="true"] .sw-t{background:#f2b066}
.kv{display:flex;justify-content:space-between;align-items:baseline}
.kv b{font-size:22px;font-weight:500}
.bars{display:flex;align-items:flex-end;gap:7px;height:70px;margin-top:10px}
.bars i{flex:1;border-radius:4px;background:#3a3631}
.bars i.on{background:#f2b066}
.fw{display:flex;align-items:center;gap:12px}
.fw .dot{width:34px;height:34px;border-radius:50%;background:#26231f;display:grid;place-items:center;flex:none}
.fw .dot svg{width:16px;height:16px;stroke:#9fd29f}
.ckbtn{height:40px;border-radius:14px;background:#26231f;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #8f887d;border-top-color:#f0ebe2;animation:rot .8s linear infinite;display:none}
.ckbtn.busy .spin{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.pdots{display:flex;justify-content:center;gap:8px;margin-top:22px}
.pdots button{width:7px;height:7px;border-radius:50%;background:rgba(255,248,235,.25);transition:background .3s, width .4s var(--ease-out)}
.pdots button.on{background:#f0ebe2;width:22px;border-radius:4px}

/* =========================================================
   MANIFESTO
   ========================================================= */
#manifesto{padding:160px 0 150px;background:var(--white)}
.quote{font-size:clamp(34px,5vw,72px);line-height:1.06;letter-spacing:-.03em;font-weight:400;margin:0;max-width:16em}
.quote em{font-style:normal;color:var(--copper)}
.man-cols{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:64px;max-width:980px}
.man-cols p{font-size:18px;line-height:1.6;color:var(--ink-2);margin:0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);margin-top:100px;position:relative}
.steps::before{content:"";position:absolute;left:0;right:0;top:7px;height:1px;background:var(--line)}
.steps .line{position:absolute;left:0;top:7px;height:1px;background:var(--ink);width:0;transition:width 2.4s var(--ease-out)}
.steps.in .line{width:100%}
.step{padding-right:28px;position:relative}
.step i{display:block;width:15px;height:15px;border-radius:50%;background:var(--white);border:1.5px solid var(--ink);margin-bottom:22px;position:relative;z-index:1}
.step:last-child i{background:var(--copper);border-color:var(--copper);box-shadow:0 0 0 6px rgba(184,116,58,.15)}
.step b{display:block;font-size:17px;font-weight:600;margin-bottom:6px}
.step span{font-size:14.5px;color:var(--ink-2);line-height:1.5}
.designer{display:flex;align-items:center;gap:22px;margin-top:96px;padding-top:40px;border-top:1px solid var(--line)}
.designer .mono{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:18px;letter-spacing:.08em;font-weight:500;flex:none}
.designer small{display:block;font-size:13px;color:var(--muted)}
.designer b{display:block;font-size:20px;font-weight:500;margin:2px 0 4px}
.designer span{font-size:15px;color:var(--ink-2)}

/* =========================================================
   SPECIFICHE + FAQ
   ========================================================= */
#specifiche{padding:140px 0 120px;background:var(--paper)}
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--paper-2);margin-bottom:40px}
.tabs button{height:38px;padding:0 18px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted);transition:background .3s, color .3s, box-shadow .3s}
.tabs button.on{background:var(--white);color:var(--ink);box-shadow:0 2px 8px -2px rgba(0,0,0,.15)}
.spec-grid{display:grid;grid-template-columns:minmax(260px,.8fr) 1.2fr;gap:56px;align-items:start}
.dimfig{background:var(--white);border-radius:var(--r-lg);border:1px solid var(--line);padding:28px;display:flex;justify-content:center}
.dimfig svg{width:100%;max-width:320px;height:auto}
.rows{margin:0;transition:opacity .35s var(--ease)}
.rows.fade{opacity:0}
.rows .row{display:grid;grid-template-columns:minmax(140px,.7fr) 1.3fr;gap:24px;padding:18px 0;border-bottom:1px solid var(--line);font-size:15px}
.rows .row:first-child{border-top:1px solid var(--line)}
.rows dt{color:var(--muted)}
.rows dd{margin:0;font-weight:500}
.faq{margin-top:128px;display:grid;grid-template-columns:minmax(220px,.8fr) 1.2fr;gap:56px}
.faq .q{border-bottom:1px solid var(--line)}
.faq .q:first-child{border-top:1px solid var(--line)}
.faq .q > button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;text-align:left;font-size:17px;font-weight:500}
.faq .q > button i{position:relative;width:14px;height:14px;flex:none}
.faq .q > button i::before,.faq .q > button i::after{content:"";position:absolute;left:0;top:6.25px;width:14px;height:1.5px;background:currentColor;transition:transform .45s var(--ease-out)}
.faq .q > button i::after{transform:rotate(90deg)}
.faq .q.open > button i::after{transform:rotate(0)}
.faq .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease-out)}
.faq .q.open .a{grid-template-rows:1fr}
.faq .a > div{overflow:hidden}
.faq .a p{margin:0 0 24px;font-size:15.5px;line-height:1.6;color:var(--ink-2);max-width:40em}

/* =========================================================
   WAITLIST + FOOTER
   ========================================================= */
#preordine{padding:150px 0;text-align:center;overflow:hidden}
#preordine .lead{margin:20px auto 0}
.wl{display:flex;gap:8px;max-width:460px;margin:40px auto 0;padding:6px;border-radius:999px;background:#1c1a17;border:1px solid var(--dark-line);transition:border-color .3s}
.wl:focus-within{border-color:rgba(255,212,154,.5)}
.wl input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:0 18px;font-size:15px;color:#f3eee6}
.wl input::placeholder{color:#7d766c}
.wl .btn{height:44px}
.wl-msg{min-height:22px;margin:14px 0 0;font-size:14px;color:#c9c2b6}
.wl-msg.err{color:#e59a8a}
.demo{font-size:11.5px;color:#6f685e;margin-top:6px}
footer{background:var(--dark);color:#8f887d;padding:40px 0 48px;border-top:1px solid var(--dark-line);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
footer .logo{color:#f3eee6;font-weight:600;letter-spacing:.42em}
footer .lang select{color:#c9c2b6}

/* =========================================================
   DRAWER CHECKOUT
   ========================================================= */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(12,11,10,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:90;width:min(470px,100vw);background:var(--paper);display:flex;flex-direction:column;transform:translateX(102%);visibility:hidden;transition:transform .7s var(--ease-out), visibility 0s .7s;box-shadow:-40px 0 80px -40px rgba(0,0,0,.35)}
.drawer.on{transform:none;visibility:visible;transition:transform .7s var(--ease-out)}
.dr-head{padding:22px 26px 18px;display:flex;justify-content:space-between;align-items:center}
.dr-head h2{margin:0;font-size:22px;font-weight:500;letter-spacing:-.01em}
.xbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);transition:background .25s}
.xbtn:hover{background:#e1dbd2}
.xbtn svg{width:14px;height:14px}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 26px 18px;border-bottom:1px solid var(--line)}
.stepper div{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.stepper div::before{content:"";display:block;height:3px;border-radius:2px;background:var(--paper-2);margin-bottom:8px;transition:background .5s var(--ease)}
.stepper div.on{color:var(--ink)}
.stepper div.on::before{background:var(--ink)}
.stepper.hide{display:none}
.dr-body{flex:1;overflow:auto;padding:22px 26px;position:relative}
.dr-view{animation:viewin .6s var(--ease-out)}
@keyframes viewin{from{opacity:0;transform:translateX(16px)}}
.dr-foot{padding:18px 26px 24px;border-top:1px solid var(--line);background:var(--paper)}
.dr-foot .ln{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);margin-bottom:6px}
.dr-foot .ln.tot{font-size:17px;color:var(--ink);font-weight:600;margin:10px 0 16px}
.dr-foot .acts{display:flex;gap:10px}
.dr-foot .acts .btn{flex:1;height:50px}
.dr-foot .acts .btn-ghost{flex:0 0 auto}
.item{display:grid;grid-template-columns:76px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);animation:viewin .5s var(--ease-out)}
.item .th{width:76px;height:96px;border-radius:14px;background:radial-gradient(circle at 50% 35%,#fff,#e8e3db);display:grid;place-items:center}
.item .th svg{height:84px;width:auto}
.item h4{margin:2px 0 3px;font-size:16px;font-weight:600;letter-spacing:.2em}
.item p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.item .rm{font-size:12.5px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;margin-top:10px}
.item .r{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.item .r strong{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:32px}
.qty button{width:30px;height:30px;font-size:16px;color:var(--ink-2)}
.qty span{min-width:18px;text-align:center;font-size:13.5px;font-weight:600}
.empty{text-align:center;padding:70px 10px}
.empty p{color:var(--muted);margin:0 0 20px}
.reassure{display:flex;flex-direction:column;gap:12px;margin-top:22px;padding:18px;border-radius:var(--r-md);background:var(--white)}
.reassure div{display:flex;gap:12px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.reassure svg{width:20px;height:20px;stroke:var(--ink-2);flex:none}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;grid-column:span 2;min-width:0}
.fld.half{grid-column:span 1}
.fld label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.fld input,.fld select{width:100%;min-width:0;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--white);padding:0 14px;font-size:15px;outline:0;transition:border-color .25s, box-shadow .25s}
.fld input:focus,.fld select:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(22,21,19,.06)}
.fld.bad input{border-color:#c0533f}
.fld .err{font-size:12px;color:#b2412d;min-height:0;display:none}
.fld.bad .err{display:block}
.pays{display:grid;gap:8px;margin:6px 0 18px}
.pay{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--white);text-align:left;font-size:14.5px;font-weight:500;transition:border-color .25s}
.pay i{width:18px;height:18px;border-radius:50%;border:1.5px solid #bbb3a8;position:relative;flex:none;transition:border-color .25s}
.pay.on{border-color:var(--ink)}
.pay.on i{border-color:var(--ink)}
.pay.on i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.box{padding:16px;border-radius:var(--r-md);background:var(--white);font-size:14px;color:var(--ink-2);line-height:1.5;margin-bottom:12px}
.box .hd{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.box .hd button{font-size:13px;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2)}
.paynote{display:flex;gap:10px;font-size:13.5px;color:var(--ink-2);line-height:1.5;padding:14px 16px;border-radius:14px;background:#efe6d8}
.done{text-align:center;padding:30px 4px 10px}
.done .ok{width:72px;height:72px;margin:0 auto 22px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.done .ok svg{width:30px;height:30px;stroke:#fff;stroke-width:2;fill:none;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .8s .25s var(--ease-out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h3{font-size:26px;font-weight:500;margin:0 0 10px;letter-spacing:-.01em}
.done p{color:var(--ink-2);margin:0 auto;max-width:28em;font-size:15px}
.tl{list-style:none;padding:0;margin:34px 0 0;text-align:left}
.tl li{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.tl li b{width:24px;height:24px;border-radius:50%;background:var(--paper-2);font-size:12px;display:grid;place-items:center;flex:none}
.demo-l{font-size:11.5px;color:var(--muted);text-align:center;margin:18px 0 0}
.done .demo-l{margin-top:26px}

.toast{position:fixed;left:50%;bottom:28px;z-index:95;transform:translate(-50%,calc(100% + 40px));visibility:hidden;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 20px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);transition:transform .6s var(--ease-out), visibility 0s .6s}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .6s var(--ease-out)}
.toast button{height:34px;padding:0 14px;border-radius:999px;background:#fff;color:var(--ink);font-size:13px;font-weight:500}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width:1080px){
  .cards{grid-template-columns:1fr 1fr}
  .app-grid{gap:48px}
}
@media (max-width:1120px){
  .nav{grid-template-columns:1fr auto}
  .nav ul{display:none}
}
@media (max-width:900px){
  .nav{padding:0 16px}
  .nav .btn{display:none}
  .sec-head{flex-direction:column;align-items:flex-start;gap:0}
  .sec-head .lead{margin-top:18px}
  .cfg{grid-template-columns:1fr}
  #viewer{position:relative;top:0;height:62vh;min-height:420px}
  .app-grid{grid-template-columns:minmax(0,1fr)}
  .man-cols,.spec-grid,.faq{grid-template-columns:1fr;gap:28px}
  .steps{grid-template-columns:1fr 1fr;row-gap:44px}
  .steps::before,.steps .line{display:none}
  .chapter{left:20px;right:20px;width:auto;top:auto;bottom:7vh;transform:none;padding:22px 22px 24px;border-radius:22px;background:rgba(12,11,10,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,248,235,.08)}
  .chapter p{font-size:15px;margin-top:12px}
  .chapter h2{font-size:30px}
  .rail{right:12px}
  .stage .fb{top:15vh;height:46vh}
}
@media (max-width:560px){
  .wrap{width:calc(100% - 36px)}
  .cards{grid-template-columns:1fr}
  .card{min-height:0}
  .swatches{grid-template-columns:repeat(4,1fr);gap:14px;max-width:260px}
  .hero-bottom .sub{display:none}
  .hero-bottom .btn{height:44px;padding:0 18px;font-size:14px}
  .lang select{padding:0 22px 0 10px}
  .rows .row{grid-template-columns:1fr;gap:4px}
  .form{grid-template-columns:1fr}
  .fld.half{grid-column:span 2}
  .trust div{font-size:10.5px}
  .glow{gap:10px}
  .glow svg{height:100px}

"hero.tagline":["Tre pezzi d'acciaio. Una luce che si appoggia.","Three pieces of steel. A light that simply rests.","Drei Teile Stahl. Ein Licht, das einfach aufliegt.","Trois pièces d'acier. Une lumière qui se pose.","Tres piezas de acero. Una luz que se apoya.","三つのスチールパーツ。そっと置かれた光。","三块钢件。一盏轻轻安放的灯。"],
"hero.sub":["Una base, due semigusci e una lampadina posata in una conca. Nessuna vite in vista, nessun cavo in vista.","A base, two half-shells and a bulb resting in a cradle. No visible screws, no visible cable.","Ein Sockel, zwei Halbschalen und eine Glühbirne, die in einer Mulde ruht. Keine sichtbaren Schrauben, kein sichtbares Kabel.","Un socle, deux demi-coques et une ampoule posée dans un creux. Aucune vis apparente, aucun câble apparent.","Una base, dos medias carcasas y una bombilla apoyada en una cuna. Sin tornillos a la vista, sin cables a la vista.","ベースと二つのハーフシェル、そしてくぼみに置かれた電球。見えるネジも、見えるケーブルもありません。","一个底座、两片半壳，以及安放在凹槽中的灯泡。看不到螺丝，也看不到电线。"],

"ch1.k":["01 — Anatomia","01 — Anatomy","01 — Anatomie","01 — Anatomie","01 — Anatomía","01 — 構造","01 — 结构"],
"ch1.t":["Tre pezzi. Nient'altro.","Three pieces. Nothing else.","Drei Teile. Sonst nichts.","Trois pièces. Rien d'autre.","Tres piezas. Nada más.","三つのパーツ。それだけ。","三个部件。仅此而已。"],
"ch1.b":["Una base e due semigusci in acciaio inox. Si accostano, si incastrano e stanno in piedi per peso. Il resto è luce.","A base and two stainless steel half-shells. They meet, lock together and stand by their own weight. The rest is light.","Ein Sockel und zwei Halbschalen aus Edelstahl. Sie fügen sich zusammen und stehen durch ihr eigenes Gewicht. Der Rest ist Licht.","Un socle et deux demi-coques en inox. Elles se rapprochent, s'emboîtent et tiennent par leur propre poids. Le reste est lumière.","Una base y dos medias carcasas de acero inoxidable. Se juntan, encajan y se sostienen por su propio peso. Lo demás es luz.","ステンレスのベースと二つのハーフシェル。寄せ合わせてはめ込むと、自重で立ちます。あとは光だけ。","一个底座和两片不锈钢半壳。合拢、嵌合，靠自身重量站立。其余的，都是光。"],
"ch2.k":["02 — La conca","02 — The cradle","02 — Die Mulde","02 — Le creux","02 — La cuna","02 — くぼみ","02 — 灯托"],
"ch2.t":["La lampadina si appoggia.","The bulb simply rests.","Die Birne liegt einfach auf.","L'ampoule se pose.","La bombilla se apoya.","電球は、ただ置くだけ。","灯泡，只需轻轻放上。"],
"ch2.b":["In cima al fusto c'è una conca sferica con lo stesso raggio di una G60. Il globo ci si posa a contatto pieno, come un frutto nel palmo di una mano.","At the top of the stem sits a spherical cradle with the same radius as a G60 bulb. The globe settles into full contact, like fruit in the palm of a hand.","Oben im Schaft liegt eine kugelförmige Mulde mit dem Radius einer G60-Birne. Der Glaskolben liegt vollflächig auf, wie eine Frucht in der Handfläche.","En haut du fût, un creux sphérique du même rayon qu'une ampoule G60. Le globe s'y pose en plein contact, comme un fruit dans le creux de la main.","En lo alto del fuste hay una cuna esférica con el mismo radio que una G60. El globo se asienta en contacto pleno, como una fruta en la palma de la mano.","軸の頂部には、G60電球と同じ半径の球面のくぼみがあります。手のひらに果物をのせるように、ガラス球がぴたりと収まります。","灯柱顶端有一个球形凹槽，半径与 G60 灯泡相同。玻璃球完全贴合其中，就像掌心托着一枚果实。"],
"ch3.k":["03 — La fessura","03 — The slit","03 — Der Spalt","03 — La fente","03 — La ranura","03 — スリット","03 — 缝隙"],
"ch3.t":["Un filo di luce.","A thread of light.","Ein Lichtfaden.","Un fil de lumière.","Un hilo de luz.","一筋の光。","一线光。"],
"ch3.b":["Tra i due semigusci restano 5 millimetri. Quando la lampada è accesa, la luce scende lungo il fusto e lo disegna dall'interno.","Five millimetres separate the two half-shells. When the lamp is on, light runs down the stem and draws it from within.","Zwischen den Halbschalen bleiben 5 Millimeter. Ist die Leuchte an, läuft das Licht den Schaft hinab und zeichnet ihn von innen.","Cinq millimètres séparent les deux demi-coques. Lampe allumée, la lumière descend le long du fût et le dessine de l'intérieur.","Entre las dos medias carcasas quedan 5 milímetros. Con la lámpara encendida, la luz recorre el fuste y lo dibuja desde dentro.","二つのハーフシェルの間には5ミリの隙間。点灯すると光が軸を伝って流れ落ち、内側からそのかたちを描きます。","两片半壳之间留有 5 毫米的缝隙。灯亮时，光沿灯柱流下，从内部勾勒出它的轮廓。"],

"ch4.b":["140 millimetri per lato, 19 di spessore, spigoli raccordati. Quasi tre chili d'acciaio che tengono la lampada ferma senza bisogno d'altro.","140 millimetres a side, 19 thick, softened edges. Nearly three kilos of steel that keep the lamp steady, with nothing else needed.","140 Millimeter Kantenlänge, 19 Millimeter stark, gerundete Kanten. Fast drei Kilo Stahl halten die Leuchte ruhig, mehr braucht es nicht.","140 millimètres de côté, 19 d'épaisseur, arêtes adoucies. Près de trois kilos d'acier qui tiennent la lampe immobile, sans rien d'autre.","140 milímetros por lado, 19 de grosor, cantos redondeados. Casi tres kilos de acero que mantienen la lámpara firme sin necesidad de nada más.","一辺140ミリ、厚さ19ミリ、角は丸く。約3キロのスチールが、ほかに何も使わずにランプをしっかり支えます。","边长 140 毫米，厚 19 毫米，边角圆润。近三公斤的钢材让灯稳稳立住，无需其他任何东西。"],
"ch5.k":["05 — Tecnologia invisibile","05 — Invisible technology","05 — Unsichtbare Technik","05 — Technologie invisible","05 — Tecnología invisible","05 — 見えないテクノロジー","05 — 隐形的科技"],
"ch5.t":["Tutto quello che non vedi.","Everything you don't see.","Alles, was du nicht siehst.","Tout ce que vous ne voyez pas.","Todo lo que no ves.","見えない、すべてのもの。","你看不见的一切。"],
"ch5.b":["Il cavo scende al centro del fusto, attraversa la base e corre in una canalina nascosta fino al retro. Sotto, una piastra a filo e quattro piedini in silicone.","The cable runs down the centre of the stem, through the base and along a hidden channel to the back. Underneath: a flush plate and four silicone feet.","Das Kabel läuft mittig durch den Schaft, durch den Sockel und in einem verdeckten Kanal nach hinten. Unten: eine bündige Platte und vier Silikonfüße.","Le câble descend au centre du fût, traverse le socle et file dans une rainure cachée jusqu'à l'arrière. Dessous : une plaque affleurante et quatre patins en silicone.","El cable baja por el centro del fuste, atraviesa la base y recorre un canal oculto hasta la parte trasera. Debajo: una placa enrasada y cuatro pies de silicona.","ケーブルは軸の中心を下りてベースを抜け、隠れた溝を通って背面へ。底面にはフラットなプレートと4つのシリコン脚。","电线从灯柱中心向下穿过底座，沿隐藏的线槽通向背面。底部是一块齐平的盖板和四个硅胶脚垫。"],

"hs1.b":["Ricavata nei due semigusci con lo stesso raggio del globo G60: la lampadina resta centrata senza ghiere né clip.","Machined into both half-shells to the exact radius of a G60 globe, so the bulb stays centred with no rings or clips.","In beide Halbschalen gefräst, im exakten Radius eines G60-Kolbens: Die Birne bleibt ohne Ringe oder Clips zentriert.","Usiné dans les deux demi-coques au rayon exact d'un globe G60 : l'ampoule reste centrée, sans bague ni clip.","Mecanizada en las dos medias carcasas con el radio exacto de un globo G60: la bombilla queda centrada sin aros ni pinzas.","両方のハーフシェルに、G60のガラス球と同じ半径で削り出したくぼみ。リングもクリップも使わずに、電球が中心に収まります。","在两片半壳上加工出与 G60 灯泡完全相同的半径：无需卡环或夹子，灯泡始终居中。"],
"hs2.t":["Fessura da 5 mm","5 mm slit","5-mm-Spalt","Fente de 5 mm","Ranura de 5 mm","5 mmのスリット","5 毫米缝隙"],
"hs2.b":["Separa i due semigusci e lascia uscire una lama di luce lungo tutto il fusto.","It separates the half-shells and lets a blade of light escape along the whole stem.","Er trennt die Halbschalen und lässt eine Lichtklinge über den ganzen Schaft austreten.","Elle sépare les demi-coques et laisse filer une lame de lumière sur tout le fût.","Separa las medias carcasas y deja escapar una lámina de luz a lo largo de todo el fuste.","二つのハーフシェルを隔て、軸全体に沿って一筋の光を漏らします。","它分隔两片半壳，让一道光沿整根灯柱透出。"],

"hs3.b":["Spigoli R 10 in pianta e bordo raccordato R 1,5. Il peso tiene basso il baricentro: la lampada non si ribalta.","R 10 corners in plan and an R 1.5 rounded edge. The weight keeps the centre of gravity low, so the lamp won't tip.","R-10-Ecken im Grundriss und eine R-1,5-Kantenrundung. Das Gewicht hält den Schwerpunkt tief: Die Leuchte kippt nicht.","Angles R 10 en plan et bord arrondi R 1,5. Le poids abaisse le centre de gravité : la lampe ne bascule pas.","Esquinas R 10 en planta y canto redondeado R 1,5. El peso mantiene bajo el centro de gravedad: la lámpara no vuelca.","平面の角はR 10、縁はR 1.5の丸み。重さが重心を低く保つので、ランプは倒れません。","平面转角 R 10，边缘倒圆 R 1.5。重量让重心保持在低处，灯不会倾倒。"],
"hs4.t":["Uscita del cavo","Cable exit","Kabelauslass","Sortie du câble","Salida del cable","ケーブルの出口","出线口"],
"hs4.b":["Il cavo esce da una tacca sul retro della base. Dal davanti non si vede.","The cable leaves through a notch at the back of the base. From the front, you never see it.","Das Kabel tritt durch eine Kerbe hinten am Sockel aus. Von vorn ist es nicht zu sehen.","Le câble sort par une encoche à l'arrière du socle. De face, il est invisible.","El cable sale por una muesca en la parte trasera de la base. Desde delante no se ve.","ケーブルはベース背面の切り欠きから出ます。正面からは見えません。","电线从底座背面的切口引出，从正面看不到。"],

"det1.t":["Acciaio AISI 304","AISI 304 steel","Edelstahl AISI 304","Acier AISI 304","Acero AISI 304","AISI 304 スチール","AISI 304 不锈钢"],
"det1.b":["Lo stesso inox delle cucine professionali. Non arrugginisce, non ingiallisce, si pulisce con un panno.","The same stainless steel used in professional kitchens. It won't rust or yellow, and a cloth is all it needs.","Derselbe Edelstahl wie in Profiküchen. Er rostet nicht, vergilbt nicht und lässt sich mit einem Tuch reinigen.","Le même inox que dans les cuisines professionnelles. Il ne rouille pas, ne jaunit pas et se nettoie d'un coup de chiffon.","El mismo inoxidable de las cocinas profesionales. No se oxida, no amarillea y se limpia con un paño.","プロの厨房と同じステンレス。錆びず、黄ばまず、布で拭くだけでお手入れできます。","与专业厨房相同的不锈钢。不生锈、不发黄，用布一擦即净。"],
"det2.t":["Spazzolato a mano","Hand-brushed","Von Hand gebürstet","Brossé à la main","Cepillado a mano","手作業のヘアライン","手工拉丝"],
"det2.b":["Ogni pezzo è satinato in verticale, nel verso del fusto. La luce scivola sulla superficie invece di rimbalzare.","Every piece is brushed vertically, along the stem. Light glides across the surface instead of bouncing off it.","Jedes Teil wird senkrecht gebürstet, in Richtung des Schafts. Das Licht gleitet über die Oberfläche, statt zurückzuprallen.","Chaque pièce est brossée verticalement, dans le sens du fût. La lumière glisse sur la surface au lieu de rebondir.","Cada pieza se satina en vertical, en el sentido del fuste. La luz se desliza por la superficie en lugar de rebotar.","どのパーツも軸に沿って縦方向にヘアライン加工。光は表面で跳ね返らず、すべるように流れます。","每个部件都沿灯柱方向竖向拉丝。光在表面滑过，而不是反弹。"],
"det3.t":["Verniciatura a polvere","Powder coating","Pulverbeschichtung","Laquage époxy","Pintura en polvo","粉体塗装","粉末喷涂"],
"det3.b":["Per le versioni a colore usiamo polveri poliestere cotte in forno. Opache e vellutate, oppure lucide e profonde.","Colour versions are finished in oven-cured polyester powder. Velvety matte, or deep gloss.","Die Farbversionen erhalten eine ofengehärtete Polyester-Pulverbeschichtung. Samtig matt oder tief glänzend.","Les versions en couleur reçoivent une poudre polyester cuite au four. Mate et veloutée, ou brillante et profonde.","Las versiones en color llevan pintura de poliéster en polvo curada al horno. Mate y aterciopelada, o brillante y profunda.","カラーモデルには焼付けのポリエステル粉体塗料を使用。しっとりとしたマット、または深みのあるグロス。","彩色款采用烘烤固化的聚酯粉末涂层。哑光如丝绒，或亮光而深邃。"],
"det4.t":["Si apre solo dove serve","It only opens where it needs to","Öffnet sich nur, wo es nötig ist","Elle ne s'ouvre que là où il faut","Solo se abre donde hace falta","開くのは、必要なところだけ","只在需要的地方打开"],
"det4.b":["Tre pezzi d'acciaio che restano uniti: base e semigusci non si smontano e non si sostituiscono. L'unica parte che si svita è la piastra sotto la base, fissata con quattro viti. A fine vita l'acciaio si ricicla per intero.","Three pieces of steel that stay together: the base and half-shells can't be taken apart or replaced. The only part that unscrews is the plate under the base, held by four screws. At the end of its life, the steel is fully recyclable.","Drei Teile Stahl, die zusammenbleiben: Sockel und Halbschalen lassen sich weder zerlegen noch austauschen. Abschrauben lässt sich nur die Platte unter dem Sockel, gehalten von vier Schrauben. Am Ende ist der Stahl vollständig recycelbar.","Trois pièces d'acier qui restent solidaires : le socle et les demi-coques ne se démontent pas et ne se remplacent pas. Seule la plaque sous le socle, tenue par quatre vis, se dévisse. En fin de vie, l'acier se recycle entièrement.","Tres piezas de acero que permanecen unidas: la base y las medias carcasas no se desmontan ni se sustituyen. Lo único que se desatornilla es la placa bajo la base, sujeta con cuatro tornillos. Al final de su vida, el acero se recicla por completo.","三つのスチールパーツは一体のまま。ベースと二つのシェルは分解も交換もできません。外せるのはベース裏のプレートだけで、四本のネジで留めてあります。役目を終えたら、スチールはすべてリサイクルできます。","三个钢制部件始终连为一体：底座和两片半壳无法拆卸，也不能更换。唯一可以拧开的是底座下方的盖板，由四颗螺丝固定。寿命结束时，钢材可完全回收。"],

"app.s":["Un modulo grande come una scatola di fiammiferi entra nel vano sotto la base. Da lì gestisci luce, scene e orari dal telefono. Oppure te ne dimentichi.","A module the size of a matchbox slots into the recess under the base. From there you control light, scenes and schedules from your phone. Or you simply forget it's there.","Ein Modul in Streichholzschachtelgröße sitzt im Fach unter dem Sockel. Von dort steuerst du Licht, Szenen und Zeiten per Smartphone. Oder du vergisst es einfach.","Un module de la taille d'une boîte d'allumettes se loge sous le socle. De là, vous pilotez lumière, ambiances et horaires depuis votre téléphone. Ou vous l'oubliez.","Un módulo del tamaño de una caja de cerillas encaja en el hueco bajo la base. Desde ahí controlas luz, escenas y horarios con el móvil. O te olvidas de él.","マッチ箱ほどの大きさのモジュールが、ベース下の収納部に収まります。スマートフォンから光、シーン、スケジュールを操作。あるいは、その存在を忘れてしまってもかまいません。","一个火柴盒大小的模块嵌入底座下方的凹槽。你可以用手机控制灯光、场景和时间表。或者，干脆忘了它的存在。"],

"man.q1":["Una lampada non dovrebbe chiedere attenzione.","A lamp shouldn't ask for attention.","Eine Leuchte sollte keine Aufmerksamkeit verlangen.","Une lampe ne devrait pas réclamer l'attention.","Una lámpara no debería pedir atención.","ランプは、目立とうとしなくていい。","一盏灯，不该索取关注。"],
"man.q2":["Dovrebbe darne.","It should give it.","Sie sollte sie schenken.","Elle devrait en donner.","Debería darla.","ひとに、光を向ければいい。","而应给予关注。"],
"man.p1":["Lume nasce da una domanda semplice: cosa resta di una lampada se togli tutto quello che non serve? Resta qualcosa che regge una lampadina, e la luce che ne esce.","Lume began with a simple question: what's left of a lamp once you take away everything it doesn't need? Something that holds a bulb, and the light that comes from it.","Lume begann mit einer einfachen Frage: Was bleibt von einer Leuchte, wenn man alles Überflüssige weglässt? Etwas, das eine Glühbirne hält, und das Licht, das daraus entsteht.","Lume est née d'une question simple : que reste-t-il d'une lampe quand on retire tout ce qui ne sert pas ? Un objet qui tient une ampoule, et la lumière qui en sort.","Lume nace de una pregunta sencilla: ¿qué queda de una lámpara si le quitas todo lo que sobra? Algo que sostiene una bombilla, y la luz que sale de ella.","Lumeはシンプルな問いから生まれました。必要のないものをすべて取り除いたら、ランプには何が残るのか。残るのは、電球を支えるものと、そこから生まれる光です。","Lume 源于一个简单的问题：去掉一切多余之物，一盏灯还剩下什么？剩下的，是托住灯泡的东西，以及从中透出的光。"],
"man.p2":["La prima versione era in cemento: pesante, bella, fragile. La seconda è in acciaio. Tre pezzi che si tengono insieme da soli, con ogni misura decisa al decimo di millimetro.","The first version was concrete: heavy, beautiful, fragile. The second is steel. Three pieces that hold themselves together, with every measurement settled to a tenth of a millimetre.","Die erste Version war aus Beton: schwer, schön, zerbrechlich. Die zweite ist aus Stahl. Drei Teile, die sich selbst zusammenhalten, jedes Maß auf den Zehntelmillimeter festgelegt.","La première version était en béton : lourde, belle, fragile. La seconde est en acier. Trois pièces qui tiennent ensemble toutes seules, chaque cote fixée au dixième de millimètre.","La primera versión era de hormigón: pesada, bonita, frágil. La segunda es de acero. Tres piezas que se sostienen solas, con cada medida fijada a la décima de milímetro.","最初のバージョンはコンクリートでした。重く、美しく、そして壊れやすい。二つ目はスチール。三つのパーツが互いに支え合い、すべての寸法は0.1ミリ単位で決められています。","第一版是混凝土：沉重、美丽、易碎。第二版是钢：三个部件彼此支撑，每一个尺寸都精确到十分之一毫米。"],

"man.bio":["Disegna oggetti come si disegnano le città: pochi elementi, ognuno al suo posto.","He designs objects the way you'd design a city: few elements, each in its place.","Er entwirft Objekte, wie man Städte entwirft: wenige Elemente, jedes an seinem Platz.","Il dessine des objets comme on dessine des villes : peu d'éléments, chacun à sa place.","Diseña objetos como se diseñan ciudades: pocos elementos, cada uno en su sitio.","都市を設計するように、ものをデザインする。要素は少なく、それぞれをあるべき場所に。","他像规划城市一样设计物件：元素不多，各安其位。"],

"a1":["La prima serie entra in produzione alla chiusura dei pre-ordini. Prima di spedire ti scriviamo con la data esatta.","The first series goes into production when pre-orders close. We'll email you the exact date before it ships.","Die erste Serie geht in Produktion, sobald die Vorbestellung schließt. Vor dem Versand schreiben wir dir das genaue Datum.","La première série entre en production à la clôture des précommandes. Nous vous écrivons la date exacte avant l'expédition.","La primera serie entra en producción al cerrar las reservas. Antes del envío te escribimos con la fecha exacta.","ファーストシリーズは予約受付の終了後に生産を開始します。発送前に、正確な日程をメールでお知らせします。","首批系列将在预订结束后投产。发货前，我们会通过邮件告知确切日期。"],
"q2":["Posso usare altre lampadine?","Can I use other bulbs?","Kann ich andere Leuchtmittel verwenden?","Puis-je utiliser d'autres ampoules ?","¿Puedo usar otras bombillas?","ほかの電球も使えますか？","可以使用其他灯泡吗？"],
"a2":["La conca è calibrata sulla G60 (Ø 60 mm), ma anche i globi E27 più grandi si appoggiano bene sul bordo. Le lampadine più piccole restano troppo infossate.","The cradle is sized for a G60 (Ø 60 mm), but larger E27 globes also sit well on the rim. Smaller bulbs sink too deep.","Die Mulde ist auf G60 (Ø 60 mm) abgestimmt, größere E27-Kolben liegen aber auch gut auf dem Rand. Kleinere Birnen sitzen zu tief.","Le creux est calibré pour une G60 (Ø 60 mm), mais les globes E27 plus grands se posent aussi très bien sur le bord. Les ampoules plus petites s'enfoncent trop.","La cuna está calibrada para una G60 (Ø 60 mm), pero los globos E27 más grandes también se apoyan bien en el borde. Las bombillas más pequeñas quedan demasiado hundidas.","くぼみはG60（Ø 60 mm）に合わせていますが、より大きなE27のグローブ電球も縁にしっかり収まります。小さな電球は深く沈みすぎてしまいます。","灯托按 G60（Ø 60 毫米）设计，但更大的 E27 球泡也能稳稳搁在边缘。较小的灯泡则会陷得太深。"],
"q3":["Si scalda?","Does it get hot?","Wird sie heiß?","Est-ce qu'elle chauffe ?","¿Se calienta?","熱くなりますか？","会发烫吗？"],
"a3":["Con una LED da 4–8 W l'acciaio resta a temperatura ambiente. Sconsigliamo le lampadine a incandescenza.","With a 4–8 W LED the steel stays at room temperature. We don't recommend incandescent bulbs.","Mit einer 4–8-W-LED bleibt der Stahl auf Raumtemperatur. Von Glühlampen raten wir ab.","Avec une LED de 4 à 8 W, l'acier reste à température ambiante. Nous déconseillons les ampoules à incandescence.","Con una LED de 4–8 W el acero se mantiene a temperatura ambiente. No recomendamos bombillas incandescentes.","4〜8 WのLEDなら、スチールは室温のままです。白熱電球はおすすめしません。","使用 4–8 W 的 LED 灯泡时，钢材保持室温。不建议使用白炽灯泡。"],
"q4":["Come si pulisce?","How do I clean it?","Wie reinige ich sie?","Comment l'entretenir ?","¿Cómo se limpia?","お手入れの方法は？","如何清洁？"],
"a4":["Panno morbido e un po' d'acqua. Sull'inox spazzolato passa sempre nel verso della satinatura, dall'alto in basso.","A soft cloth and a little water. On brushed steel, always wipe with the grain, top to bottom.","Ein weiches Tuch und etwas Wasser. Bei gebürstetem Edelstahl immer in Schliffrichtung wischen, von oben nach unten.","Un chiffon doux et un peu d'eau. Sur l'inox brossé, essuyez toujours dans le sens du brossage, de haut en bas.","Un paño suave y un poco de agua. En el inox cepillado, pásalo siempre en el sentido del satinado, de arriba abajo.","やわらかい布と少量の水で。ヘアラインのステンレスは、必ず筋の向きに沿って上から下へ拭いてください。","用软布蘸少量清水即可。拉丝不锈钢请始终顺着拉丝方向，从上往下擦拭。"],
"q5":["Resi e garanzia","Returns and warranty","Rückgabe und Garantie","Retours et garantie","Devoluciones y garantía","返品と保証","退货与质保"],
"a5":["Hai 30 giorni per il reso, gratuito. La struttura è garantita 5 anni, l'elettronica 2.","You have 30 days for a free return. The structure is covered for 5 years, the electronics for 2.","Du hast 30 Tage für eine kostenlose Rückgabe. Auf die Struktur gibt es 5 Jahre Garantie, auf die Elektronik 2.","Vous disposez de 30 jours pour un retour gratuit. La structure est garantie 5 ans, l'électronique 2 ans.","Tienes 30 días para devolverla gratis. La estructura tiene 5 años de garantía y la electrónica, 2.","30日以内なら返品は無料です。本体構造は5年、電子部品は2年の保証付きです。","30 天内可免费退货。结构质保 5 年，电子元件质保 2 年。"],
"q6":["Come viene spedita?","How is it shipped?","Wie wird sie versendet?","Comment est-elle expédiée ?","¿Cómo se envía?","どのように発送されますか？","如何发货？"],
"a6":["In un imballo su misura, con i tre pezzi bloccati separatamente in sagome di polpa di cellulosa. Spedizione assicurata e tracciata, gratuita in tutta l'UE.","In made-to-fit packaging, each of the three pieces held separately in moulded pulp. Insured, tracked and free across the EU.","In einer Maßverpackung, jedes der drei Teile einzeln in Formzellstoff gehalten. Versichert, verfolgbar und kostenlos in der ganzen EU.","Dans un emballage sur mesure, chaque pièce calée séparément dans de la pulpe moulée. Envoi assuré, suivi et offert dans toute l'UE.","En un embalaje a medida, con cada una de las tres piezas sujeta por separado en pulpa moldeada. Envío asegurado, con seguimiento y gratuito en toda la UE.","専用設計の梱包で、三つのパーツをそれぞれパルプモールドで固定してお届けします。保険・追跡付きで、EU全域送料無料です。","采用定制包装，三个部件分别固定在模塑纸浆中。全程保价、可追踪，欧盟境内免运费。"],
"q7":["Lume Connect è necessario?","Do I need Lume Connect?","Brauche ich Lume Connect?","Lume Connect est-il indispensable ?","¿Hace falta Lume Connect?","Lume Connectは必要ですか？","必须购买 Lume Connect 吗？"],
"a7":["No. Lume funziona benissimo con il suo interruttore. Il modulo si può aggiungere anche in seguito: si fissa nel vano sotto la base.","No. Lume works perfectly well with its own switch. You can add the module later: it fits into the recess under the base.","Nein. Lume funktioniert bestens mit dem eigenen Schalter. Das Modul lässt sich jederzeit nachrüsten: Es sitzt im Fach unter dem Sockel.","Non. Lume fonctionne très bien avec son interrupteur. Le module peut s'ajouter plus tard : il se fixe sous le socle.","No. Lume funciona perfectamente con su interruptor. El módulo se puede añadir más adelante: se fija en el hueco bajo la base.","いいえ。Lumeは本体のスイッチだけで十分に使えます。モジュールは後からでも追加でき、ベース下の収納部に取り付けます。","不需要。Lume 使用自带开关就能很好地工作。模块也可以以后再加装：固定在底座下方的凹槽里即可。"],

<script>
(() => {
"use strict";
/* =========================================================
   Utilità
   ========================================================= */
const T = window.LUME_T, SPEC = window.LUME_SPEC;
const LANGS = ["it","en","de","fr","es","ja","zh"];
const LOC = { it:"it-IT", en:"en-IE", de:"de-DE", fr:"fr-FR", es:"es-ES", ja:"ja-JP", zh:"zh-CN" };
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const clamp = (v,a=0,b=1) => Math.min(b, Math.max(a, v));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => t*t*(3-2*t);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },

const isMobile = () => innerWidth <= 900;

/* =========================================================
   Lingua

let lang = (() => {

})();
const li = () => LANGS.indexOf(lang);
function t(k, vars){
  const row = T[k];
  let s = row ? (row[li()] ?? row[0]) : k;
  if (vars) for (const v in vars) s = s.split("{"+v+"}").join(vars[v]);

}
const money = v => new Intl.NumberFormat(LOC[lang], { style:"currency", currency:"EUR", maximumFractionDigits:0 }).format(v);

/* =========================================================

const PRICE = { inox:390, matte:440, gloss:460, bulb:19, connect:59 };

const colorHex = id => (COLORS.find(c => c.id === id) || COLORS[0]).hex;

const saved = store.get("lume.cfg") || {};
const cfg = { finish:"inox", surface:"matte", color:"verde", bulb:true, connect:false };
if (["inox","paint"].includes(saved.finish)) cfg.finish = saved.finish;
if (["matte","gloss"].includes(saved.surface)) cfg.surface = saved.surface;
if (COLORS.some(c => c.id === saved.color)) cfg.color = saved.color;
if (typeof saved.bulb === "boolean") cfg.bulb = saved.bulb;
if (typeof saved.connect === "boolean") cfg.connect = saved.connect;

const unitPrice = c => (c.finish === "inox" ? PRICE.inox : PRICE[c.surface]) + (c.bulb ? PRICE.bulb : 0) + (c.connect ? PRICE.connect : 0);
const finishLabel = c => c.finish === "inox" ? t("cfg.inox") : t("col."+c.color) + " · " + t("cfg."+c.surface);
const extrasLabel = c => [c.bulb && t("part.bulb"), c.connect && "Lume Connect"].filter(Boolean).join(" + ");
const describe = c => { const x = extrasLabel(c); return finishLabel(c) + (x ? " · " + x : ""); };
const keyOf = c => c.finish === "inox" ? `inox|${+c.bulb}|${+c.connect}` : `paint|${c.surface}|${c.color}|${+c.bulb}|${+c.connect}`;

/* bus condiviso con il modulo 3D */

const LUME = window.LUME = {

};

/* =========================================================
   Disegno 2D della lampada (fallback senza WebGL, carrello, quote)
   ========================================================= */
let svgN = 0;
function lampSVG({ dark=false, dims=false } = {}){
  const p = "lp" + (++svgN) + "_";
  const st = dark ? "rgba(255,248,235,.28)" : "rgba(22,21,19,.45)";
  const vb = dims ? "-62 -6 300 382" : "0 0 200 345";
  const ar = dims ? "300/382" : "200/345";
  const dim = dims ? `
    <g class="dims" stroke="#7b756c" stroke-width=".7" fill="none">
      <path d="M-14 339V58M-19 339h10M-19 58h10"/>
      <path d="M-42 339V15M-47 339h10M-47 15h10" stroke-dasharray="3 2.5"/>
      <path d="M30 356h140M30 351v10M170 351v10"/>
      <path d="M70 52h60M70 47v10M130 47v10"/>
    </g>
    <g fill="#3a3733" font-family="Helvetica Neue,Helvetica,Arial" font-size="10.5" text-anchor="middle">
      <text transform="translate(-19 200) rotate(-90)" dy="-2">281</text>
      <text transform="translate(-47 180) rotate(-90)" dy="-2">324</text>
      <text x="100" y="371">140</text>
    </g>
    <g fill="#3a3733" font-family="Helvetica Neue,Helvetica,Arial" font-size="10.5"><text x="136" y="49">Ø 60</text><text x="150" y="182" fill="#7b756c">5</text></g>
    <path d="M103 182h44" stroke="#7b756c" stroke-width=".6"/>` : "";
  return `<svg class="lamp-svg" viewBox="${vb}" style="height:100%;width:auto;aspect-ratio:${ar};overflow:visible" aria-hidden="true">
    <defs>
      <linearGradient id="${p}ix" x1="0" x2="1"><stop offset="0" stop-color="#8d8f93"/><stop offset=".3" stop-color="#e9eaec"/><stop offset=".55" stop-color="#a6a8ab"/><stop offset=".8" stop-color="#f2f3f4"/><stop offset="1" stop-color="#95979a"/></linearGradient>
      <linearGradient id="${p}ixb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#eceef0"/><stop offset="1" stop-color="#9fa1a4"/></linearGradient>
      <linearGradient id="${p}gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".22" stop-color="#fff" stop-opacity=".6"/><stop offset=".34" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <radialGradient id="${p}halo"><stop offset="0" stop-color="#fffaf0"/><stop offset=".12" stop-color="#ffe6c2" stop-opacity=".95"/><stop offset=".3" stop-color="#ffc98a" stop-opacity=".45"/><stop offset=".6" stop-color="#ffa858" stop-opacity=".12"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
      <radialGradient id="${p}glass" cx=".45" cy=".42"><stop offset="0" stop-color="#fffdf7"/><stop offset=".55" stop-color="#fff0d8"/><stop offset="1" stop-color="#ffd9a6"/></radialGradient>
    </defs>
    <g class="g-halo" opacity="0"><circle cx="100" cy="45" r="110" fill="url(#${p}halo)"/></g>
    <g class="g-bulb"><circle class="bulb-c" cx="100" cy="45" r="30" fill="none" stroke="${st}" stroke-width=".8" stroke-dasharray="3 2.4"/></g>
    <rect class="g-strip" x="97.6" y="60" width="4.8" height="256" fill="#ffd49a" opacity="0"/>
    <g class="g-l"><rect class="body" x="70" y="58" width="27.5" height="260" rx=".8" stroke="${st}" stroke-width=".6"/><rect class="gls" x="70" y="58" width="27.5" height="260" fill="url(#${p}gl)" opacity="0"/></g>
    <g class="g-r"><rect class="body" x="102.5" y="58" width="27.5" height="260" rx=".8" stroke="${st}" stroke-width=".6"/><rect class="gls" x="102.5" y="58" width="27.5" height="260" fill="url(#${p}gl)" opacity="0"/></g>
    <g class="g-b"><rect class="body base" x="30" y="318" width="140" height="19" rx="2.5" stroke="${st}" stroke-width=".6"/><rect x="39" y="337" width="12" height="2" fill="#222"/><rect x="149" y="337" width="12" height="2" fill="#222"/></g>
    ${dim}
  </svg>`;
}
function paintSVG(svg, c){
  if (!svg) return;
  const id = (svg.querySelector("linearGradient") || {}).id || "";
  const p = id.replace(/ix$/, "");
  $$(".body", svg).forEach(r => {
    const base = r.classList.contains("base");
    r.setAttribute("fill", c.finish === "inox" ? `url(#${p}${base ? "ixb" : "ix"})` : colorHex(c.color));
  });
  $$(".gls", svg).forEach(r => r.setAttribute("opacity", c.finish === "paint" && c.surface === "gloss" ? "1" : "0"));
}
function lightSVG(svg, k, e=0){
  if (!svg) return;
  const halo = $(".g-halo", svg), bc = $(".bulb-c", svg), strip = $(".g-strip", svg);
  halo.setAttribute("opacity", (k*.95).toFixed(3));
  const gid = (svg.querySelector("radialGradient[id$='glass']") || {}).id;
  bc.setAttribute("fill", k > .02 ? `url(#${gid})` : "none");
  bc.setAttribute("fill-opacity", k > .02 ? (.3 + .7*k).toFixed(3) : "0");
  strip.setAttribute("opacity", (k*(1-e)*.9).toFixed(3));
}
function explodeSVG(svg, e){
  if (!svg) return;
  const s = smooth(clamp(e));
  $(".g-l", svg).setAttribute("transform", `translate(${-34*s} ${-26*s})`);
  $(".g-r", svg).setAttribute("transform", `translate(${34*s} ${-26*s})`);
  $(".g-bulb", svg).setAttribute("transform", `translate(0 ${-70*s})`);
  $(".g-halo", svg).setAttribute("transform", `translate(0 ${-70*s})`);
  $(".g-b", svg).setAttribute("transform", `translate(0 ${18*s})`);
}

/* inserimento disegni */
$("#storyFb").innerHTML = lampSVG({ dark:true });
$("#viewerFb").innerHTML = lampSVG();
$("#dimfig").innerHTML = lampSVG({ dims:true });
const storySVG = $("#storyFb svg"), viewerSVG = $("#viewerFb svg"), dimSVG = $("#dimfig svg");

paintSVG(dimSVG, { finish:"inox" });

/* =========================================================
   Navigazione
   ========================================================= */
const nav = $("#nav");
function goto(id){
  let y = 0;
  if (id !== "top" && id !== "design"){
    const el = id === "viewer" ? $("#viewer") : document.getElementById(id);

}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-goto]");
  if (!b) return;
  goto(b.dataset.goto);
  if (b.dataset.flash) setTimeout(() => { const a = $("#addBtn"); a.classList.remove("flash"); void a.offsetWidth; a.classList.add("flash"); }, 900);
  if (b.dataset.explore) setTimeout(() => { if (!LUME.studio.light) toggleStudioLight(); LUME.emit("explore"); }, 900);
});
const navSections = $$("main > section");
function updateNav(){
  const y = 60;
  let cur = navSections[0];
  for (const s of navSections){ const r = s.getBoundingClientRect(); if (r.top <= y && r.bottom > y){ cur = s; break; } }
  if (scrollY + innerHeight >= document.documentElement.scrollHeight - 4) cur = $("#preordine");
  nav.classList.toggle("light", (cur.dataset.theme || "light") === "light");
  $$(".nav ul button").forEach(b => b.classList.toggle("on", b.dataset.goto === cur.id));
}

/* =========================================================
   Testi / lingua
   ========================================================= */
function applyI18n(){
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
  document.title = t("doc.title");
  $$("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
